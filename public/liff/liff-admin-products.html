<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn { background: #00b900; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:disabled { background: #ccc; }
        h2 { margin-top: 0; color: #00b900; border-bottom: 2px solid #00b900; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>✨ 新增商品上架</h2>
    
    <div id="addProductForm">
        <div class="input-group">
            <label>商品代碼 (可不填，由系統生成)</label>
            <input type="text" id="pCode" placeholder="例如: A01">
        </div>
        
        <div class="input-group">
            <label>商品名稱 *</label>
            <input type="text" id="pName" placeholder="請輸入商品名稱">
        </div>

        <div class="input-group">
            <label>上架類型</label>
            <select id="isStock" onchange="document.getElementById('stockBox').style.display = (this.value==='true'?'block':'none')">
                <option value="false">預購商品 (無庫存限制)</option>
                <option value="true">現貨商品 (需輸入庫存)</option>
            </select>
        </div>

        <div id="stockBox" class="input-group" style="display:none;">
            <label style="color: #e74c3c;">現貨庫存數量</label>
            <input type="number" id="pStock" value="0">
        </div>

        <div class="input-group">
            <label>銷售單價</label>
            <input type="number" id="pPrice" placeholder="0">
        </div>

        <div class="input-group">
            <label>成本價</label>
            <input type="number" id="pCost" placeholder="0">
        </div>

        <button type="button" class="btn" id="submitBtn" onclick="submitProduct()">確認上架商品</button>
    </div>
</div>

<script>
    async function submitProduct() {
        const btn = document.getElementById('submitBtn');
        const name = document.getElementById('pName').value;
        
        if (!name) return alert("請輸入商品名稱！");

        btn.disabled = true;
        btn.innerText = "正在寫入 Google 試算表...";

        const payload = {
            productCode: document.getElementById('pCode').value || 'P' + Date.now().toString().slice(-6),
            productName: name,
            price: Number(document.getElementById('pPrice').value) || 0,
            cost: Number(document.getElementById('pCost').value) || 0,
            isStock: document.getElementById('isStock').value === 'true',
            stock: Number(document.getElementById('pStock').value) || 0,
            status: '上架'
        };

        try {
            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();

            if (res.ok) {
                alert("✅ 上架成功！資料已寫入 Products 表格。");
                // 成功後重整頁面清空欄位，且不帶任何參數
                window.location.href = window.location.pathname; 
            } else {
                alert("❌ 上架失敗: " + (result.error || "未知錯誤"));
            }
        } catch (e) {
            alert("❌ 網路連線失敗，請確認 Render 是否正常啟動");
        } finally {
            btn.disabled = false;
            btn.innerText = "確認上架商品";
        }
    }

    async function init() {
        await liff.init({ liffId: "您的管理端LIFF_ID" }).catch(console.error);
    }
    init();
</script>
</body>
</html>
