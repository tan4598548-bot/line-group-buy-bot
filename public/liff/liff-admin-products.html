<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f4; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #00b900; color: white; border: none; padding: 10px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h3>新增上架商品</h3>
    <div class="input-group">
        <label>商品代碼</label>
        <input type="text" id="pCode" placeholder="如 P618484">
    </div>
    <div class="input-group">
        <label>商品名稱</label>
        <input type="text" id="pName">
    </div>
    <div class="input-group">
        <label>上架類型</label>
        <select id="isStock" onchange="toggleStock()">
            <option value="false">預購商品</option>
            <option value="true">現貨商品</option>
        </select>
    </div>
    <div id="stockDiv" class="input-group" style="display:none;">
        <label style="color:red;">現貨庫存數量</label>
        <input type="number" id="pStock" value="0">
    </div>
    <div class="input-group">
        <label>單價</label>
        <input type="number" id="pPrice">
    </div>
    <div class="input-group">
        <label>成本</label>
        <input type="number" id="pCost">
    </div>
    <button type="button" class="btn" onclick="submitProduct()">確認上架</button>
</div>

<script>
    function toggleStock() {
        const isStock = document.getElementById('isStock').value === 'true';
        document.getElementById('stockDiv').style.display = isStock ? 'block' : 'none';
    }

    async function submitProduct() {
        const btn = document.querySelector('.btn');
        if (!document.getElementById('pName').value) return alert("請輸入名稱");
        
        btn.disabled = true;
        btn.innerText = "處理中...";

        const payload = {
            productCode: document.getElementById('pCode').value || 'P' + Date.now().toString().slice(-6),
            productName: document.getElementById('pName').value,
            price: Number(document.getElementById('pPrice').value) || 0,
            cost: Number(document.getElementById('pCost').value) || 0,
            isStock: document.getElementById('isStock').value === 'true',
            stock: Number(document.getElementById('pStock').value) || 0,
            specSize: '', color: '', images: '', status: '上架'
        };

        try {
            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (res.ok) {
                alert("✅ 上架成功！");
                location.reload();
            } else {
                alert("❌ 失敗: " + (result.error || "未知錯誤"));
            }
        } catch (e) { alert("連線異常"); }
        finally { btn.disabled = false; btn.innerText = "確認上架"; }
    }

    async function initLIFF() {
        await liff.init({ liffId: "您的管理端LIFF_ID" }).catch(e => console.log("非LINE開啟"));
        if (liff.isInClient() && !liff.isLoggedIn()) liff.login();
    }
    window.onload = initLIFF;
</script>
</body>
</html>
