<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8f9fa; padding: 15px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-return { color: #666; text-decoration: none; font-size: 16px; }
    .btn-add { background: #00c300; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }
    .product-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; }
    .status-badge { position: absolute; top: 15px; right: 15px; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #e8f5e9; color: #2e7d32; }
    .p-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 5px; padding-right: 60px; }
    .p-detail { font-size: 14px; color: #666; margin-bottom: 10px; line-height: 1.5; }
    .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .action-btn { border: none; padding: 8px 0; border-radius: 4px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-edit { background: #007bff; } .btn-close { background: #6c757d; } .btn-out { background: #ffc107; color: #333; } .btn-del { background: #dc3545; }
    
    /* 彈窗樣式 */
    #editModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; width:90%; max-width:400px; padding:20px; border-radius:12px; }
    .modal-content h3 { margin-top:0; }
    .modal-content label { display:block; font-size:12px; color:#666; margin-top:10px; }
    .modal-content input { width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
    .modal-btns { display:flex; gap:10px; margin-top:20px; }
    .modal-btns button { flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
    .save-btn { background:#00c300; color:white; }
    .cancel-btn { background:#eee; color:#666; }
  </style>
</head>
<body>

  <div class="header">
    <a href="liff-admin-dashboard.html" class="btn-return">⬅ 返回中心</a>
    <a href="liff-admin-add-product.html" class="btn-add">+ 新增商品</a>
  </div>

  <div id="productList">正在讀取商品清單...</div>

  <div id="editModal">
    <div class="modal-content">
      <h3 id="modalTitle">修正商品資料</h3>
      <input type="hidden" id="editCode">
      
      <label>商品名稱</label>
      <input type="text" id="editName">
      
      <label>規格尺寸 (可用逗號 , 或頓號 、 隔開)</label>
      <input type="text" id="editSpec">
      
      <label>尺寸/顏色 (可用逗號 , 或頓號 、 隔開)</label>
      <input type="text" id="editColor">
      
      <label>單價</label>
      <input type="number" id="editPrice">
      
      <label>庫存數量</label>
      <input type="number" id="editStock">
      
      <div class="modal-btns">
        <button class="cancel-btn" onclick="closeModal()">取消</button>
        <button class="save-btn" onclick="saveProduct()">儲存修改</button>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];

    // 打開彈窗並帶入值
    function openEditModal(code) {
      const p = allProducts.find(item => item.productCode === code);
      if(!p) return;

      document.getElementById('editCode').value = p.productCode;
      document.getElementById('editName').value = p.productName;
      document.getElementById('editSpec').value = p.specSize || '';
      document.getElementById('editColor').value = p.color || '';
      document.getElementById('editPrice').value = p.price;
      document.getElementById('editStock').value = p.stock || 0;
      
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function saveProduct() {
      const code = document.getElementById('editCode').value;
      const data = {
        productName: document.getElementById('editName').value,
        specSize: document.getElementById('editSpec').value,
        color: document.getElementById('editColor').value,
        price: parseInt(document.getElementById('editPrice').value),
        stock: parseInt(document.getElementById('editStock').value)
      };

      try {
        const res = await fetch(`/api/products/${code}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          alert("修改成功！");
          closeModal();
          loadProducts();
        }
      } catch (e) { alert("儲存失敗"); }
    }

    async function updateStatus(code, newStatus) {
      if (!confirm(`確定要改為「${newStatus}」嗎？`)) return;
      try {
        const res = await fetch(`/api/products/${code}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) { loadProducts(); }
      } catch (e) { alert("更新失敗"); }
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products?t=' + Date.now());
        allProducts = await res.json();
        const listDiv = document.getElementById('productList');
        listDiv.innerHTML = '';

        allProducts.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <div class="status-badge">${p.status}</div>
            <div class="p-title">${p.productName}</div>
            <div class="p-detail">
              代碼: ${p.productCode} | 價格: <b style="color:#e44d26">$${p.price}</b><br>
              庫存: <b>${p.stock || 0}</b> | 規格: ${p.specSize || '無'}<br>
              尺寸/顏色: ${p.color || '無'}
            </div>
            <div class="btn-group">
              <button class="action-btn btn-edit" onclick="openEditModal('${p.productCode}')">修正</button>
              <button class="action-btn btn-close" onclick="updateStatus('${p.productCode}', '已結單')">結單</button>
              <button class="action-btn btn-out" onclick="updateStatus('${p.productCode}', '斷貨')">斷貨</button>
              <button class="action-btn btn-del" onclick="updateStatus('${p.productCode}', '已刪除')">刪除</button>
            </div>
          `;
          listDiv.appendChild(card);
        });
      } catch (e) { document.getElementById('productList').innerText = "載入失敗"; }
    }

    liff.init({ liffId: "2008857998-AoqmEajq" }).then(() => {
      if (!liff.isLoggedIn()) liff.login();
      loadProducts();
    });
  </script>
</body>
</html>
