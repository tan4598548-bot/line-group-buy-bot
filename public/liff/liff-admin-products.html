<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f4; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #00b900; color: white; border: none; padding: 12px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h3 style="color:#00b900">📦 新增商品上架</h3>
    <div id="addArea">
        <div class="input-group">
            <label>商品代碼 (不填由系統生成)</label>
            <input type="text" id="pCode" placeholder="如 P618484">
        </div>
        <div class="input-group">
            <label>商品名稱 *</label>
            <input type="text" id="pName">
        </div>
        <div class="input-group">
            <label>是否現貨</label>
            <select id="isStock" onchange="document.getElementById('stockInput').style.display = (this.value==='true'?'block':'none')">
                <option value="false">預購</option>
                <option value="true">現貨</option>
            </select>
        </div>
        <div id="stockInput" class="input-group" style="display:none">
            <label>庫存數量</label>
            <input type="number" id="pStock" value="0">
        </div>
        <div class="input-group">
            <label>銷售單價</label>
            <input type="number" id="pPrice" value="0">
        </div>
        <div class="input-group">
            <label>成本價</label>
            <input type="number" id="pCost" value="0">
        </div>
        <button type="button" class="btn" id="submitBtn" onclick="submitProduct()">確認送出上架</button>
    </div>
</div>

<script>
    async function submitProduct() {
        const name = document.getElementById('pName').value;
        if (!name) return alert("請輸入商品名稱");

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "連線中...";

        const payload = {
            productCode: document.getElementById('pCode').value || 'P' + Date.now().toString().slice(-6),
            productName: name,
            isStock: document.getElementById('isStock').value === 'true',
            stock: Number(document.getElementById('pStock').value) || 0,
            price: Number(document.getElementById('pPrice').value) || 0,
            cost: Number(document.getElementById('pCost').value) || 0
        };

        try {
            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert("✅ 上架成功！");
                window.location.reload();
            } else {
                alert("❌ 失敗：400 Bad Request，請確認後端路由是否正確掛載。");
            }
        } catch (e) {
            alert("❌ 網路異常，請確認後端服務已啟動。");
        } finally {
            btn.disabled = false;
            btn.innerText = "確認送出上架";
        }
    }
    
    liff.init({ liffId: "您的管理端LIFF_ID" });
</script>
</body>
</html>
