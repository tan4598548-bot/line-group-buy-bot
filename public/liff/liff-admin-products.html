<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>商品管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .p-card { background:white; margin-bottom:15px; padding:15px; border-radius:10px; border-left:5px solid #007bff; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .status { float:right; padding:2px 8px; border-radius:4px; font-size:12px; }
        .st-上架 { background:#d4edda; color:#155724; }
        .st-已結單 { background:#fff3cd; color:#856404; }
        .st-斷貨 { background:#f8d7da; color:#721c24; }
        .btns { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; border-top:1px solid #eee; padding-top:10px; }
        button { flex:1; padding:8px; border-radius:4px; border:1px solid #ddd; background:#fff; font-size:12px; }
        .btn-add { width:100%; background:#007bff; color:white; padding:12px; margin-bottom:20px; font-weight:bold; }
    </style>
</head>
<body>
    <button onclick="location.href='liff-admin-dashboard.html'">⬅ 返回</button>
    <h3>📦 商品管理 (1)</h3>
    <button class="btn-add" onclick="location.href='liff-admin-add-product.html'">➕ 上架新商品</button>
    <div id="list">載入中...</div>

<script>
    let products = [];
    async function init() {
        await liff.init({ liffId: "2008857998-AoqmEajq" });
        load();
    }
    async function load() {
        const res = await fetch("/api/products?t="+Date.now());
        products = await res.json();
        document.getElementById("list").innerHTML = products.map(p => {
            const isExpired = p.closeDate && new Date(p.closeDate) < new Date();
            const displayStatus = isExpired ? "已結單" : (p.status || "上架");
            return `
            <div class="p-card">
                <span class="status st-${displayStatus}">${displayStatus}</span>
                <strong>${p.productName}</strong><br>
                <small>代碼: ${p.productCode} / 價格: $${p.price} / 成本: $${p.cost || '未設'}</small><br>
                <small>結單日: ${p.closeDate || '未設'}</small>
                <div class="btns">
                    <button onclick="location.href='liff-admin-edit-product.html?code=${p.productCode}'">修正/編輯</button>
                    <button onclick="updateStatus('${p.productCode}', '已結單')">手動結單</button>
                    <button onclick="markOutOfStock('${p.productCode}')" style="color:red">斷貨回報</button>
                    <button onclick="delProduct('${p.productCode}')">刪除</button>
                </div>
            </div>`;
        }).join("");
    }
    async function updateStatus(code, status) {
        if(!confirm(`確定將此商品設為 ${status}?`)) return;
        await fetch(`/api/products/${code}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status}) });
        load();
    }
    async function markOutOfStock(code) {
        if(!confirm("確定標記斷貨？系統將發送通知給所有訂購者。")) return;
        await fetch(`/api/admin/products/out-of-stock`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productCode:code}) });
        load();
    }
    async function delProduct(code) {
        if(!confirm("確定刪除此商品？")) return;
        await fetch(`/api/products/${code}`, { method:'DELETE' });
        load();
    }
    window.onload = init;
</script>
</body>
</html>
