<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>出貨清單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { margin: 0; }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="pdf"></iframe>

  <script>
    async function init() {
      await liff.init({ liffId: 'YOUR_LIFF_ID' });
      document.getElementById('pdf').src = '/ship/pdf';
    }
    init();
  </script>
</body>
</html>
