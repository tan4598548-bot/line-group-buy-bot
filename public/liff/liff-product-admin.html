<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>商品管理</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    .product {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }
    button {
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <h2>🛠 商品管理</h2>
  <div id="list">讀取中...</div>

<script>
async function main() {
  await liff.init({ liffId: "2008857998-AoqmEajq" });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const res = await fetch("/api/products");
  const products = await res.json();

  const el = document.getElementById("list");
  el.innerHTML = products.map(p => `
    <div class="product">
      <b>${p.name}</b><br/>
      狀態：${p.active ? "上架中" : "已下架"}<br/>
      <button onclick="setActive('${p.code}', ${!p.active})">
        ${p.active ? "下架" : "上架"}
      </button>
      <button onclick="closeProduct('${p.code}')">結單</button>
    </div>
  `).join("");
}

async function setActive(code, active) {
  await fetch("/api/product/active", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ productCode: code, active })
  });
  location.reload();
}

async function closeProduct(code) {
  if (!confirm("確定結單？")) return;
  await fetch("/api/product/close", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ productCode: code })
  });
  location.reload();
}

main();
</script>
</body>
</html>
