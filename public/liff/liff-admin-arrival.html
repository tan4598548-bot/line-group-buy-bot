<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>到貨點貨管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; padding: 15px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .order-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ccc; }
    .status-已到貨 { border-left-color: #28a745; }
    .status-待點貨 { border-left-color: #ffc107; }
    .status-select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="header"><button onclick="location.href='liff-admin-dashboard.html'">⬅ 返回</button><h3>📥 到貨點貨</h3></div>
  <div id="list">載入中...</div>

<script>
    let orders = [];
    async function init() {
      await liff.init({ liffId: "2008857998-ePcCkr6K" });
      loadOrders();
    }
    async function loadOrders() {
      const res = await fetch("/api/admin/orders?t=" + Date.now());
      orders = await res.json();
      document.getElementById("list").innerHTML = orders.filter(o => o.status !== '買家取消').map(o => `
        <div class="order-item status-${o.status}">
          <div style="display:flex; justify-content:space-between;">
            <strong>${o.buyerName}</strong>
            <span style="color:#007bff; font-weight:bold;">${o.qty} 件</span>
          </div>
          <div style="font-size: 14px; color: #666;">${o.productName} (${o.spec})</div>
          <select class="status-select" onchange="updateStatus('${o.orderId}', this.value)">
            <option value="待點貨" ${o.status==='待點貨'?'selected':''}>⏳ 待點貨</option>
            <option value="部分到貨">⚠️ 部分到貨 (拆單)</option>
            <option value="已到貨" ${o.status==='已到貨'?'selected':''}>✅ 已到貨(齊全)</option>
            <option value="斷貨" ${o.status==='斷貨'?'selected':''}>❌ 斷貨</option>
          </select>
        </div>
      `).join("");
    }
    async function updateStatus(orderId, newStatus) {
      if (newStatus === "部分到貨") {
        const order = orders.find(o => o.orderId === orderId);
        const arrivalQty = prompt(`[拆單] 原數量 ${order.qty}，請輸入本次到貨數:`);
        if (!arrivalQty || arrivalQty >= order.qty) return alert("數量無效");
        // 這裡後端 updateOrderWithCheck 需配合實作拆單邏輯，目前簡化為更新狀態
      }
      await fetch(`/api/admin/orders/${orderId}/status`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: newStatus })
      });
      loadOrders();
    }
    window.onload = init;
</script>
</body>
</html>
