<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>點貨入庫中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .p-name { font-weight: bold; font-size: 16px; color: #333; }
    .spec-tag { color: #007bff; font-size: 14px; margin: 5px 0; font-weight: bold; }
    .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin: 10px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #28a745; transition: width 0.3s; }
    .qty-info { display: flex; justify-content: space-between; font-size: 13px; color: #666; }
    .arrival-input-group { display: flex; gap: 8px; margin-top: 12px; }
    input[type="number"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .btn-add { background: #28a745; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <a href="liff-admin-dashboard.html" style="text-decoration:none;">❮ 返回</a>
    <h3 style="margin:0;">📦 點貨入庫</h3>
  </div>

  <div id="list">讀取採購清單中...</div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-ePcCkr6K" });
  if (!liff.isLoggedIn()) { liff.login(); return; }
  loadArrivalData();
}

async function loadArrivalData() {
  try {
    const res = await fetch('/api/admin/vendor-orders');
    const data = await res.json();
    const listDiv = document.getElementById('list');
    
    // 只顯示「未到貨」或「部分到貨」的項目
    const pendingItems = data.filter(d => d.status !== '已齊全' && d.status !== '斷貨');

    if (pendingItems.length === 0) {
      listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#999;">所有貨物均已齊全！</div>';
      return;
    }

    listDiv.innerHTML = pendingItems.map(d => {
      const percent = Math.min((d.arrivedQty / d.totalQty) * 100, 100);
      return `
        <div class="card">
          <div class="p-name">${d.productName}</div>
          <div class="spec-tag">規格：${d.spec}</div>
          <div class="qty-info">
            <span>採購總數：${d.totalQty}</span>
            <span>已到貨：${d.arrivedQty}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${percent}%"></div>
          </div>
          <div class="arrival-input-group">
            <input type="number" id="input-${d.productCode}-${d.spec}" placeholder="輸入本次到貨數量" min="1">
            <button class="btn-add" onclick="submitArrival('${d.productCode}','${d.spec}')">入庫</button>
          </div>
        </div>
      `;
    }).join("");
  } catch (e) {
    document.getElementById('list').innerHTML = "載入失敗";
  }
}

async function submitArrival(code, spec) {
  const inputEl = document.getElementById(`input-${code}-${spec}`);
  const arrivedQty = parseInt(inputEl.value);

  if (!arrivedQty || arrivedQty <= 0) {
    alert("請輸入有效的到貨數量");
    return;
  }

  try {
    const res = await fetch('/api/admin/vendor-orders/arrival', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ productCode: code, spec: spec, arrivedQty: arrivedQty })
    });

    if (res.ok) {
      alert("入庫成功！");
      loadArrivalData(); // 重新整理清單
    } else {
      alert("更新失敗");
    }
  } catch (e) {
    alert("網路錯誤");
  }
}

window.onload = init;
</script>
</body>
</html>
