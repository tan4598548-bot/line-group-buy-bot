<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>📥 到貨點貨管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; padding: 15px; margin:0; }
        .nav { margin-bottom: 15px; }
        .summary-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #28a745; }
        .product-title { font-weight: bold; font-size: 16px; color: #333; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; font-size: 13px; color: #666; }
        .count { color: #007bff; font-weight: bold; font-size: 15px; }
        select { width: 100%; height: 40px; border-radius: 8px; border: 1px solid #ddd; background: #fff; margin-top: 5px; font-size: 14px; }
        .btn-back { border: none; background: none; font-size: 16px; color: #007bff; cursor: pointer; font-weight: bold; padding: 0; }
    </style>
</head>
<body>
    <div class="nav"><button class="btn-back" onclick="location.href='liff-admin-dashboard.html'">❮ 返回管理中心</button></div>
    <h3 style="margin-top:0;">📥 廠商到貨彙整 (點貨)</h3>
    <div id="list">🔍 正在計算各商品訂購總數...</div>

<script>
    async function init() {
        await liff.init({ liffId: "2008857998-ePcCkr6K" });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        loadSummary();
    }

    async function loadSummary() {
        try {
            const res = await fetch("/api/admin/vendor-summary?t=" + Date.now());
            const data = await res.json();
            const listDiv = document.getElementById("list");
            
            if (data.length === 0) {
                listDiv.innerHTML = "目前尚無任何已結單需到貨商品";
                return;
            }

            listDiv.innerHTML = data.map(item => `
                <div class="summary-card">
                    <div class="product-title">${item.productName}</div>
                    <div style="font-size:12px; color:#999; margin-bottom:5px;">代碼: ${item.productCode}</div>
                    <div class="stat-grid">
                        <div>訂購總數: <span class="count">${item.totalOrdered}</span></div>
                        <div>實際到貨: <span class="count" style="color:#28a745">${item.totalArrived || 0}</span></div>
                    </div>
                    <label style="font-size:12px; font-weight:bold; color:#555;">變更到貨狀態：</label>
                    <select onchange="updateVendorStatus('${item.productCode}', this.value, ${item.totalOrdered})">
                        <option value="未到貨" ${item.vendorStatus==='未到貨'?'selected':''}>未到貨</option>
                        <option value="部分到貨" ${item.vendorStatus==='部分到貨'?'selected':''}>部分到貨 (拆單)</option>
                        <option value="已到齊" ${item.vendorStatus==='已到齊'?'selected':''}>已到齊</option>
                        <option value="缺貨" ${item.vendorStatus==='缺貨'?'selected':''}>廠商缺貨/斷貨</option>
                    </select>
                </div>
            `).join("");
        } catch (err) {
            document.getElementById("list").innerHTML = "讀取失敗，請確認 API 路徑是否正確";
        }
    }

    async function updateVendorStatus(code, status, total) {
        let arrivalQty = total;
        if (status === "部分到貨") {
            const val = prompt(`請輸入本次實際收到的「${code}」數量：`);
            if (val === null) return loadSummary(); // 按下取消
            if (isNaN(val) || parseInt(val) < 0) { alert("請輸入正確數字"); return loadSummary(); }
            arrivalQty = parseInt(val);
        }

        // 注意：此 API 需後端配合實作寫回 Google Sheets 邏輯
        try {
            const res = await fetch(`/api/admin/vendor-orders/${code}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status, arrivalQty })
            });
            if (res.ok) alert("狀態已更新");
        } catch (e) { alert("更新失敗"); }
        loadSummary();
    }
    window.onload = init;
</script>
</body>
</html>
