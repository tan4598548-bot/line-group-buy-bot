<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>到貨點貨系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f4f4; }
    .order-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-check { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <h3>📦 待點貨清單</h3>
  <div id="list">載入中...</div>

  <script>
    async function init() {
      await liff.init({ liffId: "2008857998-ePcCkr6K" }); // 對應 admin-arrival
      const res = await fetch("/api/admin/arrival-list");
      const data = await res.json();
      
      if(data.length === 0) {
        document.getElementById("list").innerHTML = "目前無待點貨商品";
        return;
      }

      document.getElementById("list").innerHTML = data.map(o => `
        <div class="order-card">
          <div>
            <strong>${o.productName}</strong><br>
            買家: ${o.buyerName} | 數量: ${o.qty}
          </div>
          <button class="btn-check" onclick="checkItem('${o.orderId}')">點貨勾選</button>
        </div>
      `).join("");
    }
    
    async function checkItem(id) {
      alert("訂單 " + id + " 已標記為到貨！");
      // 這裡未來 fetch POST 更新 Google Sheet 狀態
    }
    init();
  </script>
</body>
</html>
