<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🔥 現貨出清</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, "Noto Sans TC", sans-serif; padding: 0; margin: 0; background: #fff5f5; padding-bottom: 80px; }
        .header { background: #e53e3e; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: sticky; top: 0; z-index: 100; }
        .list-container { padding: 12px; }
        .p-card { background: white; border-radius: 12px; margin-bottom: 12px; border: 1px solid #feb2b2; overflow: hidden; display: flex; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .p-img { width: 100px; height: 100px; object-fit: cover; background: #eee; }
        .p-content { flex: 1; padding: 12px; position: relative; }
        .p-title { font-weight: bold; font-size: 15px; margin-bottom: 5px; color: #333; height: 42px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { color: #e53e3e; font-size: 18px; font-weight: bold; }
        .p-stock { font-size: 12px; color: #9b2c2c; background: #fff5f5; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .buy-btn { position: absolute; right: 12px; bottom: 12px; background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 2px 4px rgba(229, 62, 62, 0.3); }
        .buy-btn:active { transform: scale(0.95); background: #c53030; }
        .empty-msg { text-align: center; padding: 60px 20px; color: #999; }
        /* 導覽列 */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 55px; background: white; display: flex; border-top: 1px solid #ddd; z-index: 100; }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">🔥 限時現貨・先搶先贏</div>
    
    <div id="list" class="list-container">載入中...</div>

    <nav class="tab-bar">
        <a href="liff-product-list.html" class="tab">🏠 商城</a>
        <a href="liff-buyer-orders.html" class="tab">📋 我的訂單</a>
        <a href="liff-overstock-buyer.html" class="tab" style="color:#e53e3e;">🔥 現貨出清</a>
    </nav>

<script>
async function init() {
    try {
        // 1. 初始化 LIFF (請確保 ID 正確)
        await liff.init({ liffId: "2008857998-LKw8W2JA" });
        
        // 2. 呼叫專用現貨過濾 API
        const res = await fetch("/api/products?filter=overstock&t=" + Date.now());
        const data = await res.json();
        
        const listDiv = document.getElementById("list");
        
        if (!data || data.length === 0) {
            listDiv.innerHTML = `<div class="empty-msg">目前暫無現貨商品，<br>請留意群組最新公告！</div>`;
            return;
        }

        // 3. 渲染清單
        listDiv.innerHTML = data.map(p => {
            const imgUrl = p.images?.split(',')[0] || 'https://via.placeholder.com/150?text=No+Image';
            return `
                <div class="p-card">
                    <img class="p-img" src="${imgUrl}" loading="lazy">
                    <div class="p-content">
                        <div class="p-title">${p.productName}</div>
                        <div class="p-price">$${p.price}</div>
                        <div class="p-stock">⚡ 僅剩 ${p.stock || 0} 件</div>
                        <button class="buy-btn" onclick="location.href='liff-product-detail.html?code=${p.productCode}'">立即搶購</button>
                    </div>
                </div>
            `;
        }).join("");

    } catch (e) {
        console.error(e);
        document.getElementById("list").innerHTML = `<div class="empty-msg">載入失敗，請確認在 LINE 內開啟</div>`;
    }
}
window.onload = init;
</script>
</body>
</html>
