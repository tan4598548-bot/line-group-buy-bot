<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>新增團購商品</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #f8f9fa; padding: 20px; margin: 0; color: #333; }
    h2 { display: flex; align-items: center; font-size: 24px; margin-bottom: 20px; }
    .box-icon { width: 30px; margin-right: 10px; }
    .form-group { margin-bottom: 15px; }
    input, select { 
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; 
      box-sizing: border-box; font-size: 16px; background: #fff;
    }
    .btn-submit { 
      background: #00c300; color: white; border: none; width: 100%; 
      padding: 15px; border-radius: 6px; font-size: 18px; font-weight: bold; 
      margin-top: 10px; cursor: pointer;
    }
    .btn-submit:disabled { background: #ccc; }
  </style>
</head>
<body>
  <h2>📦 新增團購商品</h2>
  <form id="productForm">
    <div class="form-group">
      <input type="text" id="productName" placeholder="商品名稱" required>
    </div>
    <div class="form-group">
      <input type="number" id="price" placeholder="單價" required>
    </div>
    <div class="form-group">
      <input type="number" id="cost" placeholder="成本設定 (輸入成本數字)">
    </div>
    <div class="form-group">
      <input type="text" id="colorMap" placeholder="規格 (如：紅色,藍色)">
    </div>
    <div class="form-group">
      <input type="text" id="sizeMap" placeholder="尺寸 (如：S,M,L)">
    </div>
    <div class="form-group">
      <select id="type">
        <option value="normal">預購 (Normal)</option>
        <option value="overstock">現貨 (Overstock)</option>
      </select>
    </div>
    <div class="form-group">
      <input type="number" id="total_stock" placeholder="現貨初始庫存 (預購填0)" value="0">
    </div>
    <div class="form-group">
      <input type="text" id="images" placeholder="圖片連結 (網址)">
    </div>
    <div class="form-group">
      <input type="date" id="closeDate" title="結單日">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">確認上架</button>
  </form>

  <script>
    async function init() {
      try {
        await liff.init({ liffId: "2008857998-AoqmEajq" }); 
      } catch (err) { console.error("LIFF Init Error", err); }
    }

    document.getElementById("productForm").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "正在同步至試算表...";

      // 自動產生簡易代碼或讓後端處理
      const productCode = "P" + Date.now().toString().slice(-6);

      const payload = {
        productCode: productCode,
        productName: document.getElementById("productName").value,
        price: document.getElementById("price").value,
        cost: document.getElementById("cost").value, // 成本
        colorMap: document.getElementById("colorMap").value, // 顏色
        sizeMap: document.getElementById("sizeMap").value,   // 尺寸
        type: document.getElementById("type").value,
        total_stock: document.getElementById("total_stock").value,
        images: document.getElementById("images").value,
        closeDate: document.getElementById("closeDate").value
      };

      try {
        const res = await fetch("/api/products", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert("✅ 商品已成功完整上架！");
          location.href = "liff-admin-product.html";
        } else { alert("❌ 上架失敗"); }
      } catch (err) { alert("錯誤: " + err.message); }
      finally { btn.disabled = false; btn.innerText = "確認上架"; }
    };
    window.onload = init;
  </script>
</body>
</html>
