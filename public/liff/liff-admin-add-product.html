<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>上架新商品</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #f8f9fa; padding: 20px; margin: 0; color: #333; }
    h3 { display: flex; align-items: center; font-size: 24px; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; }
    input, select, textarea { 
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
      box-sizing: border-box; font-size: 16px; background: #fff;
    }
    textarea { height: 100px; resize: vertical; }
    .btn-submit { 
      background: #42b72a; color: white; border: none; width: 100%; 
      padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; 
      margin-top: 10px; cursor: pointer;
    }
    .btn-submit:disabled { background: #ccc; }
  </style>
</head>
<body>
  <h3>➕ 上架新商品</h3>
  <form id="productForm">
    <div class="form-group">
      <label>商品代碼 (例: A001)</label>
      <input type="text" id="productCode" placeholder="輸入商品代碼" required>
    </div>
    <div class="form-group">
      <label>商品名稱</label>
      <input type="text" id="productName" placeholder="輸入商品名稱" required>
    </div>
    <div class="form-group">
      <label>單價</label>
      <input type="number" id="price" placeholder="輸入單價" required>
    </div>
    <div class="form-group">
      <label>類型</label>
      <select id="type">
        <option value="normal">預購</option>
        <option value="overstock">現貨</option>
      </select>
    </div>
    <div class="form-group">
      <label>顏色對照 (例: C1:黑色,C2:白色)</label>
      <input type="text" id="colorMap" placeholder="C1:顏色1,C2:顏色2">
    </div>
    <div class="form-group">
      <label>結單日 (YYYY-MM-DD)</label>
      <input type="date" id="closeDate" required>
    </div>
    <div class="form-group">
      <label>詳細商品介紹</label>
      <textarea id="detailText" placeholder="輸入商品描述..."></textarea>
    </div>
    <div class="form-group">
      <label>圖片網址 (多張用逗號隔開)</label>
      <input type="text" id="images" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>影音檔網址 (Youtube/Video)</label>
      <input type="text" id="youtube" placeholder="https://youtube.com/...">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">確認上架</button>
  </form>

  <script>
    async function init() {
      try {
        await liff.init({ liffId: "2008857998-AoqmEajq" }); // 延用管理端 ID
      } catch (err) { console.error("LIFF Init Error", err); }
    }

    document.getElementById("productForm").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "處理中...";

      const payload = {
        productCode: document.getElementById("productCode").value,
        productName: document.getElementById("productName").value,
        price: document.getElementById("price").value,
        type: document.getElementById("type").value,
        colorMap: document.getElementById("colorMap").value,
        closeDate: document.getElementById("closeDate").value,
        detailText: document.getElementById("detailText").value,
        images: document.getElementById("images").value,
        youtube: document.getElementById("youtube").value
      };

      try {
        const res = await fetch("/api/products", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert("✅ 商品已成功完整上架！");
          location.href = "liff-admin-product.html";
        } else { alert("❌ 上架失敗，請檢查資料"); }
      } catch (err) { alert("錯誤: " + err.message); }
      finally { btn.disabled = false; btn.innerText = "確認上架"; }
    };
    window.onload = init;
  </script>
</body>
</html>
