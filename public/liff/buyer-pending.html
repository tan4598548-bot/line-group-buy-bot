<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>我的待出貨商品</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<h3>⏳ 我的尚未出貨商品</h3>
<div id="list">讀取中...</div>

<script>
async function main() {
  await liff.init({ liffId: 'YOUR_LIFF_ID' });

  const profile = await liff.getProfile();
  const lineId = profile.userId;

  const res = await fetch(`/api/myPending?lineId=${lineId}`);
  const data = await res.json();

  const el = document.getElementById('list');
  el.innerHTML = '';

  if (data.length === 0) {
    el.innerHTML = '🎉 目前沒有等待出貨的商品';
    return;
  }

  data.forEach(o => {
    el.innerHTML += `
      <div style="margin-bottom:12px">
        <b>${o.product}</b><br>
        ${o.color} / ${o.size}<br>
        數量：${o.qty}<br>
        狀態：${o.status}
      </div>
    `;
  });
}

main();
</script>

</body>
</html>
