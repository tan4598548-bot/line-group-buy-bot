<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Phonmain 管理後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      padding: 16px;
    }

    .menu-btn {
      width: 100%;
      padding: 18px;
      margin-bottom: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #fff;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .menu-btn span {
      font-size: 20px;
      margin-right: 10px;
    }

    .menu-btn:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 24px;
    }
  </style>
</head>

<body>

<header>
  🧾 Phonmain 管理後台
</header>

<div class="container">

  <button class="menu-btn" onclick="go('liff-product-admin.html')">
    <span>📦</span> 商品管理（上架 / 結單）
  </button>

  <button class="menu-btn" onclick="go('liff-shipping.html')">
    <span>🚚</span> 出貨 / 點貨
  </button>

  <button class="menu-btn" onclick="go('vendor-arrival.html')">
    <span>🧮</span> 廠商 / 成本管理
  </button>

  <button class="menu-btn" onclick="go('liff-buyer-orders.html')">
    <span>🔍</span> 查詢 / 修正訂單
  </button>

  <button class="menu-btn" onclick="lockNotice()">
    <span>🔒</span> 鎖單 / 防誤觸
  </button>

</div>

<footer>
  Phonmain Admin LIFF
</footer>

<script>
  async function initLiff() {
    await liff.init({ liffId: "YOUR_LIFF_ID_ADMIN" });
    if (!liff.isLoggedIn()) {
      liff.login();
    }
  }

  function go(page) {
    location.href = page;
  }

  function lockNotice() {
    alert("⚠️ 鎖單功能將於下一步實作");
  }

  initLiff();
</script>

</body>
</html>
