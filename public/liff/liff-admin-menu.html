<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>管理員後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f2f2;
      padding: 16px;
      display: none; /* 🔐 驗證通過前先隱藏 */
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .btn {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      cursor: pointer;
    }
    .btn:active {
      background: #e6e6e6;
    }
    .info-tag {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h2>🛠 團購管理入口</h2>

  <div class="btn" onclick="go('liff-admin-product.html')">🧺 商品上架 / 結單</div>
  <div class="btn" onclick="go('liff-admin-arrival.html')">📦 到貨點貨</div>
  <div class="btn" onclick="go('liff-admin-shipping.html')">🚚 發貨 PDF 列印</div>
  <div class="btn" onclick="go('liff-admin-product-list.html')">📊 查詢 / 管理</div>

  <div class="info-tag" id="userIdDisplay"></div>

<script>
// 🔴 重要：前端白名單必須與 Render 上的 ADMIN_LINE_IDS 同步
// 這是為了在點開網頁第一秒就擋住非管理者
const ADMIN_IDS = [
  "U7e17a718ecb70716d376fc82ac8b2a19", // 替換為您的 ID
];

async function init() {
  try {
    await liff.init({ liffId: "2008857998-aQzlAAST" });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const context = liff.getContext();
    const userId = context.userId;

    // 前端權限檢查
    if (ADMIN_IDS.includes(userId)) {
      document.body.style.display = "block";
      document.getElementById('userIdDisplay').innerText = "管理者 ID: " + userId;
    } else {
      alert("❌ 權限不足：您的 ID (" + userId + ") 不在管理員清單中。");
      liff.closeWindow();
    }
  } catch (err) {
    console.error("LIFF 啟動失敗", err);
  }
}

function go(page) {
  // 為了讓子頁面知道是誰在操作，可以透過 URL 帶過去
  location.href = page;
}

init();
</script>
</body>
</html>
