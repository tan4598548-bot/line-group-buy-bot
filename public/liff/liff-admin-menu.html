<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>管理員後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: system-ui;
      background: #f2f2f2;
      padding: 16px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .btn {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    .btn:active {
      background: #e6e6e6;
    }
  </style>
</head>

<body>
  <h2>🛠 管理員入口</h2>

  <div class="btn" onclick="go('liff-admin-product.html')">
    🧺 商品上架 / 結單
  </div>

  <div class="btn" onclick="go('liff-admin-arrival.html')">
    📦 到貨點貨
  </div>

  <div class="btn" onclick="go('liff-admin-shipping.html')">
    🚚 發貨 PDF 列印
  </div>

  <div class="btn" onclick="go('liff-admin-dashboard.html')">
    📊 查詢 / 管理
  </div>

<script>
let adminUserId = null; // 🔴 新增：全域儲存 admin userId

async function init() {
  await liff.init({ liffId: "2008857998-aQzlAAST" });
  if (!liff.isLoggedIn()) liff.login();
adminUserId = liff.getContext().userId; // 🔴 新增  
}

function go(page) {
  location.href = page;
}

init();
</script>
</body>
</html>
