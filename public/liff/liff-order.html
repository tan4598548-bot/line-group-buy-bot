<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團購商城 - 首頁</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --primary-color: #06c755; --price-color: #e44d26; --bg: #f5f5f5; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }
    
    .header { background: white; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 18px; color: #333; }
    
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
    .product-card { background: white; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.2s; }
    .product-card:active { transform: scale(0.98); }
    .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee; }
    .product-info { padding: 10px; }
    .product-name { font-size: 14px; color: #333; font-weight: 500; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-price { color: var(--price-color); font-size: 16px; font-weight: bold; margin-top: 5px; }
    .product-price::before { content: '$'; font-size: 12px; margin-right: 2px; }
    
    .badge { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 10px; color: white; font-weight: bold; z-index: 1; }
    .status-active { background: var(--primary-color); }
    .status-closed { background: #999; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛒 團購現貨/預購</h1>
    <a href="liff-buyer-orders.html" style="color:var(--primary-color); text-decoration:none; font-size:14px; font-weight:bold;">我的訂單</a>
  </div>

  <div id="product-list" class="product-grid">
    <div style="grid-column: span 2; text-align: center; padding: 50px; color: #999;">商品加載中...</div>
  </div>

  <script>
    async function init() {
      // 使用您原本的 LIFF ID: 2008857998-imqg5sNq
      await liff.init({ liffId: "2008857998-imqg5sNq" });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      loadProducts();
    }

    async function loadProducts() {
      try {
        const res = await fetch("/api/products");
        const products = await res.json();
        const list = document.getElementById("product-list");

        list.innerHTML = products.map(p => {
          const isClosed = p.status === '已結單';
          const firstImg = p.images ? p.images.split(',')[0].trim() : 'https://via.placeholder.com/300';
          
          return `
            <div class="product-card" onclick="location.href='product-detail.html?code=${p.productCode}'">
              <span class="badge ${isClosed ? 'status-closed' : 'status-active'}">
                ${isClosed ? '已結單' : (p.isStock === 'TRUE' ? '🚚 現貨' : '⌛ 預購')}
              </span>
              <img class="product-img" src="${firstImg}">
              <div class="product-info">
                <div class="product-name">${p.productName}</div>
                <div class="product-price">${p.price}</div>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        document.getElementById("product-list").innerHTML = "載入失敗，請稍後再試";
      }
    }
    window.onload = init;
  </script>
</body>
</html>
