<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推薦商品清單</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .header { text-align: center; padding: 10px 0; font-weight: bold; font-size: 18px; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
        .name { font-weight: bold; font-size: 14px; height: 40px; overflow: hidden; margin-bottom: 5px; color: #333; line-height: 1.4; }
        .price { color: #e44d26; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .btn { display: block; width: 100%; padding: 10px 0; background: #06c755; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: auto; }
        .loading { text-align: center; margin-top: 50px; color: #888; }
    </style>
</head>
<body>
    <div class="header">🔥 熱門揪團中</div>
    <div class="grid" id="productGrid"><div class="loading">商品載入中...</div></div>

    <script>
        async function init() {
            try {
                // 沿用您原本的下單 LIFF ID
                await liff.init({ liffId: "2008857998-imqg5sNq" });
                const res = await fetch('/api/products?filter=active');
                const products = await res.json();
                
                const grid = document.getElementById('productGrid');
                if (products.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/3; text-align:center; padding: 50px; color:#999;">目前沒有上架商品</div>';
                    return;
                }

                grid.innerHTML = products.map(p => {
                    const firstImg = p.images ? p.images.split(',')[0] : 'https://via.placeholder.com/300x300?text=No+Image';
                    return `
                        <div class="card">
                            <img src="${firstImg}" alt="${p.productName}">
                            <div class="info">
                                <div class="name">${p.productName}</div>
                                <div class="price">$${p.price}</div>
                                <a href="liff-product-detail.html?code=${p.productCode}" class="btn">查看詳情/下單</a>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("載入失敗", err);
                document.getElementById('productGrid').innerText = "系統忙碌中，請稍後再試";
            }
        }
        init();
    </script>
</body>
</html>
