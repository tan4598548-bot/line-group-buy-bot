<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>團購商城</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background:#f4f4f4; margin:0; padding-bottom:60px; font-family: -apple-system, "Noto Sans TC", sans-serif; }
        .header { background:#06c755; color:white; padding:15px; text-align:center; font-weight:bold; position: sticky; top: 0; z-index: 100; }
        .p-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; }
        .p-card { background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .p-card:active { transform: scale(0.98); }
        .p-img { width:100%; aspect-ratio:1/1; object-fit:cover; background: #eee; }
        .p-info { padding:10px; }
        .p-name { font-size:13px; margin-bottom:5px; height:36px; overflow:hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; color: #333; }
        .p-price { color:#e44d26; font-weight:bold; font-size: 16px; }
        .date-tag { font-size:11px; color:#d9534f; background:#fff1f0; padding:2px 5px; border-radius:3px; margin-top:5px; display:inline-block; border: 1px solid #ffa39e; }
        .tab-bar { position:fixed; bottom:0; width:100%; height:55px; background:white; display:flex; border-top:1px solid #ddd; z-index: 100; }
        .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-decoration:none; color:#888; font-size:12px; }
        .empty-msg { grid-column: 1/3; text-align: center; padding: 50px 20px; color: #999; }
    </style>
</head>
<body>
    <div class="header">✨ 團購進行中</div>
    <div id="grid" class="p-grid">載入中...</div>
    
    <nav class="tab-bar">
        <a href="liff-product-list.html" class="tab" style="color:#06c755;">🏠 商城</a>
        <a href="liff-buyer-orders.html" class="tab">📋 我的訂單</a>
        <a href="liff-overstock-buyer.html" class="tab">🔥 現貨出清</a>
    </nav>

<script>
    async function init() {
        try {
            // 1. 初始化 LIFF
            await liff.init({ liffId: "2008857998-qCQWSTKf" });

            // 2. 向後端 API 請求商品資料 (帶入時間戳防緩存)
            const res = await fetch("/api/products?t=" + Date.now());
            const data = await res.json();
            
            // 3. 核心過濾邏輯：
            // - 必須是「上架」狀態
            // - 排除「現貨」商品 (isStock === true)，留給現貨頁面顯示
            // - 檢查結單日：如果已過期，則不顯示
            const now = new Date();
            const filtered = data.filter(p => {
                const isStatusOn = (p.status === '上架');
                const isNotOverstock = (p.isStock !== true); 
                
                // 日期檢查 (若無設定結單日則視為長期)
                let notExpired = true;
                if (p.closeDate) {
                    const closeDate = new Date(p.closeDate);
                    // 設定為當天 23:59:59 之前都算有效
                    closeDate.setHours(23, 59, 59);
                    notExpired = (closeDate >= now);
                }

                return isStatusOn && isNotOverstock && notExpired;
            });

            const grid = document.getElementById("grid");
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-msg">目前沒有進行中的團購喔！<br>請密切關注群組消息。</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const dateDisplay = p.closeDate ? p.closeDate.split('T')[0] : "長期";
                const imgUrl = p.images?.split(',')[0] || 'https://via.placeholder.com/300?text=No+Image';
                
                return `
                <div class="p-card" onclick="location.href='liff-product-detail.html?code=${p.productCode}'">
                    <img class="p-img" src="${imgUrl}" loading="lazy">
                    <div class="p-info">
                        <div class="p-name">${p.productName}</div>
                        <div class="p-price">$${p.price}</div>
                        <div class="date-tag">⏳ 結單：${dateDisplay}</div>
                    </div>
                </div>`;
            }).join("");

        } catch (e) {
            console.error(e);
            document.getElementById("grid").innerHTML = `<div class="empty-msg">載入失敗，請確認在 LINE 內開啟</div>`;
        }
    }
    window.onload = init;
</script>
</body>
</html>
