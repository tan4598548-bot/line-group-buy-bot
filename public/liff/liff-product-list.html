<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>團購商城</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f4f4; margin: 0; padding-bottom: 70px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
    .info { padding: 10px; }
    .price { color: #e44d26; font-weight: bold; font-size: 16px; }
    .tab-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 60px; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #888; font-size: 12px; }
    .tab-item.active { color: #06c755; }
  </style>
</head>
<body>
  <div style="background:white; padding:15px; text-align:center; font-weight:bold;">🛒 精選團購商城</div>
  <div id="grid" class="grid">載入中...</div>
  <nav class="tab-bar">
    <a href="liff-product-list.html" class="tab-item active">🏠<span>商城</span></a>
    <a href="liff-buyer-orders.html" class="tab-item">📋<span>我的訂單</span></a>
  </nav>
<script>
async function init() {
  await liff.init({ liffId: "2008857998-qCQWSTKf" });
  const res = await fetch("/api/products?t="+Date.now());
  const data = await res.json();
  // 僅顯示狀態為「上架」的商品，過濾掉已結單或斷貨
  document.getElementById("grid").innerHTML = data.filter(p => p.status === '上架').map(p => `
    <div class="card" onclick="location.href='liff-product-detail.html?code=${p.productCode}'">
      <img src="${p.images?.split(',')[0] || 'https://via.placeholder.com/200'}" class="img">
      <div class="info">
        <div style="font-size:13px; height:36px; overflow:hidden;">${p.productName}</div>
        <div class="price">$${p.price}</div>
      </div>
    </div>
  `).join("") || "目前尚無上架商品";
}
window.onload = init;
</script>
</body>
</html>
