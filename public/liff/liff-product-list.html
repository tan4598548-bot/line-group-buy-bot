<style>
  .date-badge { 
    background: #fff3cd; color: #856404; padding: 4px 8px; 
    border-radius: 4px; font-size: 12px; font-weight: bold; 
    display: inline-block; margin-top: 5px; border: 1px solid #ffeeba;
  }
  .date-urgent { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
</style>

<script>
// 渲染商品時
function getProductHtml(p) {
  const today = new Date().toISOString().split('T')[0];
  const isUrgent = p.closeDate && p.closeDate <= today; // 今天或已過期標紅

  return `
    <div class="product-item">
      <img src="${p.images}" width="100%">
      <h4>${p.productName}</h4>
      <div class="price">$${p.price}</div>
      ${p.closeDate ? `<div class="date-badge ${isUrgent ? 'date-urgent' : ''}">⏳ 結單日：${p.closeDate}</div>` : ''}
      <button onclick="goToDetail('${p.productCode}')">查看詳情</button>
    </div>
  `;
}
</script>
