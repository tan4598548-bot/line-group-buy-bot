<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團購商城首頁</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --primary-color: #06c755; --price-color: #e44d26; --urgent-bg: #fff1f0; --urgent-text: #cf1322; }
        body { font-family: -apple-system, sans-serif; background: #f4f4f4; margin: 0; padding-bottom: 70px; }
        .header { background: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee; }
        .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-name { font-size: 14px; font-weight: bold; color: #333; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        .price { color: var(--price-color); font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .price::before { content: "$"; font-size: 12px; }
        .date-badge { font-size: 11px; padding: 4px 6px; border-radius: 4px; background: #f0f0f0; color: #666; display: inline-block; margin-top: auto; }
        .urgent { background: var(--urgent-bg); color: var(--urgent-text); font-weight: bold; border: 1px solid #ffa39e; }
        /* 底部導覽 */
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 60px; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #888; font-size: 12px; }
        .tab-item.active { color: var(--primary-color); font-weight: bold; }
        #loading { text-align: center; padding: 50px; color: #888; }
    </style>
</head>
<body>
    <div class="header"><h2 style="margin:0; font-size:18px;">🛒 精選團購商城</h2></div>
    
    <div id="loading">🔍 正在為您挑選商品...</div>
    <div class="product-grid" id="productGrid"></div>

    <nav class="tab-bar">
        <a href="liff-product-list.html" class="tab-item active"><span>🏠</span><span>首頁商城</span></a>
        <a href="liff-buyer-orders.html" class="tab-item"><span>📋</span><span>我的訂單</span></a>
    </nav>

<script>
async function init() {
    try {
        // 請務必確認此 LIFF ID 已在 LINE Developer 後台建立
        await liff.init({ liffId: "2008857998-qCQWSTKf" }); 
        fetchProducts();
    } catch (err) { console.error(err); }
}

async function fetchProducts() {
    try {
        const res = await fetch("/api/products");
        const allProducts = await res.json();
        // 僅顯示狀態為「上架」的商品
        const activeProducts = allProducts.filter(p => p.status === '上架');
        document.getElementById("loading").style.display = "none";
        renderProducts(activeProducts);
    } catch (err) {
        document.getElementById("loading").innerText = "連線失敗，請重新開啟";
    }
}

function renderProducts(products) {
    const grid = document.getElementById("productGrid");
    const today = new Date().toISOString().split('T')[0];

    grid.innerHTML = products.map(p => {
        const isUrgent = p.closeDate && p.closeDate !== '未設定' && p.closeDate <= today;
        const imgUrl = p.images ? p.images.split(',')[0] : 'https://via.placeholder.com/300';
        
        return `
            <div class="product-card" onclick="location.href='liff-product-detail.html?code=${p.productCode}'">
                <img src="${imgUrl}" class="product-img">
                <div class="product-info">
                    <div class="product-name">${p.productName}</div>
                    <div class="price">${p.price}</div>
                    ${p.closeDate && p.closeDate !== '未設定' 
                        ? `<div class="date-badge ${isUrgent ? 'urgent' : ''}">⏳ ${p.closeDate} 結單</div>` 
                        : `<div class="date-badge">長期供應</div>`}
                </div>
            </div>
        `;
    }).join("");
}
window.onload = init;
</script>
</body>
</html>
