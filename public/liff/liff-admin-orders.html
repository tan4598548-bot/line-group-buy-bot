<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>訂單管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f7; margin:0; }
    .nav { margin-bottom: 15px; padding: 10px 0; } 
    .btn-back { color: #007bff; text-decoration: none; font-weight: bold; font-size: 16px; }
    .order-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #007bff; }
    .status-badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; float: right; background: #e9ecef; color: #495057; font-weight: bold; }
    .p-name { font-size: 16px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
    .info-line { font-size: 13px; color: #666; line-height: 1.6; }
    .price-tag { text-align: right; color: #e44d26; font-weight: bold; font-size: 16px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="nav"><a href="liff-admin-dashboard.html" class="btn-back">❮ 返回管理中心</a></div>
  <h3 style="margin-top:0;">📑 完整訂單清單</h3>
  <div id="list">🔍 正在同步雲端資料...</div>

<script>
async function init() {
  try {
    await liff.init({ liffId: "2008857998-wtK5loPp" });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    
    const res = await fetch("/api/admin/orders?t=" + Date.now());
    const data = await res.json();
    const listDiv = document.getElementById("list");
    
    if (!data || data.length === 0) {
      listDiv.innerHTML = "目前尚無訂單";
      return;
    }

    listDiv.innerHTML = data.reverse().map(o => `
      <div class="order-card">
        <span class="status-badge">${o.status}</span>
        <span class="p-name">${o.productName}</span>
        <div class="info-line">
          買家: <strong>${o.buyerName}</strong><br>
          規格: ${o.spec || '預設'} / 尺寸: ${o.color || 'F'}<br>
          數量: ${o.qty} | 日期: ${o.orderDate || '未註記'}
        </div>
        <div class="price-tag">$${o.total}</div>
      </div>
    `).join("");
  } catch (err) {
    document.getElementById("list").innerHTML = "讀取錯誤，請稍後再試";
  }
}
window.onload = init;
</script>
</body>
</html>
