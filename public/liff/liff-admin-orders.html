<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>訂單與結單管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f4f7; }
    .nav { margin-bottom: 15px; } .btn-back { color: #007bff; text-decoration: none; font-weight: bold; }
    .order-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .btn-group { margin-top: 10px; display: flex; gap: 5px; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 12px; color: white; cursor: pointer; }
    .btn-close { background: #333; } .btn-out { background: #dc3545; }
  </style>
</head>
<body>
  <div class="nav"><a href="liff-admin-dashboard.html" class="btn-back">❮ 返回管理中心</a></div>
  <h3>📑 訂單/結單管理</h3>
  <div id="orderList">載入中...</div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-jbKsKkPY" });
  loadOrders();
}
async function loadOrders() {
  const p = await liff.getProfile();
  const res = await fetch("/api/admin/orders", { headers: { "x-liff-user-id": p.userId } });
  const data = await res.json();
  document.getElementById("orderList").innerHTML = data.map(o => `
    <div class="order-card">
      <div><strong>${o.product_name}</strong> (${o.color}/${o.size})</div>
      <div style="font-size:13px; color:#666;">買家: ${o.buyer_name} | 數量: ${o.qty}</div>
      <div class="btn-group">
        <button class="btn btn-close" onclick="alert('已轉入採購清單')">結單轉出</button>
        <button class="btn btn-out" onclick="alert('已發送斷貨通知')">❌ 斷貨處理</button>
      </div>
    </div>
  `).join("");
}
init();
</script>
</body>
</html>
