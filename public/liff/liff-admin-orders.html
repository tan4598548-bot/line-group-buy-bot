<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>訂單與結單管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f4f7; color: #333; }
    .nav { margin-bottom: 15px; } 
    .btn-back { color: #007bff; text-decoration: none; font-weight: bold; display: inline-block; padding: 5px 0; }
    .order-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #06c755; }
    .product-name { font-weight: bold; font-size: 16px; color: #000; margin-bottom: 5px; }
    .order-info { font-size: 13px; color: #666; line-height: 1.6; }
    .btn-group { margin-top: 12px; display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 13px; color: white; cursor: pointer; }
    .btn-close { background: #333; } 
    .btn-out { background: #dc3545; }
    #statusMsg { padding: 20px; color: #666; text-align: center; font-size: 14px; }
    .error-box { background: #fff1f0; border: 1px solid #ffa39e; color: #cf1322; padding: 15px; border-radius: 6px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="liff-admin-dashboard.html" class="btn-back">❮ 返回管理中心</a>
  </div>
  
  <h3>📑 訂單/結單管理</h3>
  <div id="statusMsg">⚙️ 系統初始化中...</div>
  <div id="orderList"></div>

  <script>
    async function main() {
      const statusMsg = document.getElementById("statusMsg");
      try {
        // 修正：使用圖片中「我的商品詳細」對應的正確 ID
        await liff.init({ liffId: "2008857998-wtK5loPp" });
        
        if (!liff.isLoggedIn()) {
          statusMsg.innerText = "🔑 導向 LINE 登入中...";
          liff.login();
          return;
        }

        statusMsg.innerText = "📡 讀取雲端訂單中...";
        const profile = await liff.getProfile();
        await loadOrders(profile.userId);

      } catch (err) {
        console.error("LIFF Init Error:", err);
        showError("初始化失敗: " + err.message);
      }
    }

    async function loadOrders(userId) {
      try {
        const response = await fetch("/api/admin/orders", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "x-liff-user-id": userId
          }
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || `HTTP ${response.status}`);
        }

        const orders = await response.json();
        const container = document.getElementById("orderList");
        const statusMsg = document.getElementById("statusMsg");

        if (!orders || orders.length === 0) {
          statusMsg.innerHTML = "✨ 目前沒有待處理訂單。";
          return;
        }

        statusMsg.style.display = "none";
        container.innerHTML = orders.map(o => `
          <div class="order-card">
            <div class="product-name">${o.productName || '未名商品'}</div>
            <div class="order-info">
              規格: <strong>${o.color || '-'}/${o.size || '-'}</strong><br>
              買家: ${o.buyerName || '未知'}<br>
              數量: <span style="color:#06c755; font-weight:bold;">${o.qty || 0}</span>
            </div>
            <div class="btn-group">
              <button class="btn btn-close" onclick="alert('訂單 ID: ${o.orderId}')">結單轉出</button>
              <button class="btn btn-out" onclick="alert('已發送斷貨通知')">❌ 斷貨處理</button>
            </div>
          </div>
        `).join("");

      } catch (err) {
        showError("資料載入失敗: " + err.message);
      }
    }

    function showError(msg) {
      document.getElementById("statusMsg").style.display = "none";
      document.getElementById("orderList").innerHTML = `<div class="error-box"><strong>⚠️ 系統提示</strong><br>${msg}</div>`;
    }

    window.onload = main;
  </script>
</body>
</html>
