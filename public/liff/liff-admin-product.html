<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
    .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .product-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .product-title { font-weight: bold; font-size: 16px; color: #1c1e21; }
    .product-info { font-size: 13px; color: #606770; line-height: 1.6; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; color: white; margin-left: 5px; }
    .actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; pt: 10px; padding-top: 10px;}
    .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-edit { background: #e7f3ff; color: #1877f2; }
    .btn-delete { background: #ffebe9; color: #fa3e3e; }
    #status { text-align: center; padding: 20px; color: #65676b; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0;">📦 商品管理</h3>
    <button onclick="location.href='liff-admin-add-product.html'" style="background:#42b72a; color:white; border:none; padding:5px 10px; border-radius:4px;">+ 新增商品</button>
  </div>
  
  <div id="status">⌛ 正在讀取雲端資料...</div>
  <div id="product-list"></div>

<script>
async function init() {
  const status = document.getElementById("status");
  const list = document.getElementById("product-list");

  try {
    // 初始化 admin-product LIFF
    await liff.init({ liffId: "2008857998-AoqmEajq" });

    const res = await fetch("/api/products");
    const products = await res.json();

    if (products.length === 0) {
      status.innerText = "目前試算表中無商品資料。";
      return;
    }

    status.style.display = "none";
    list.innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-header">
          <div class="product-title">${p.productName}</div>
          <div>
            <span class="tag" style="background:${p.active==='TRUE'?'#42b72a':'#8e8e8e'}">${p.active==='TRUE'?'上架中':'已下架'}</span>
          </div>
        </div>
        <div class="product-info">
          代碼：${p.productCode} <br>
          單價：$${p.price} <br>
          類型：${p.type === 'overstock' ? '現貨' : '預購'} <br>
          結單日：${p.closeDate || '未設定'}
        </div>
        <div class="actions">
          <button class="btn btn-edit" onclick="editProduct('${p.productCode}')">修正</button>
          <button class="btn btn-delete" onclick="deleteProduct('${p.productCode}')">刪除</button>
        </div>
      </div>
    `).join("");

  } catch (err) {
    status.innerText = "❌ 無法載入： " + err.message;
  }
}

function editProduct(code) {
  // 導向編輯頁面 (未來擴充)
  alert("修正功能：將開啟商品代碼 " + code + " 的編輯視窗");
}

async function deleteProduct(code) {
  if (!confirm("確定要刪除商品 " + code + " 嗎？此動作將從 Google Sheet 移除。")) return;

  try {
    const res = await fetch("/api/products/" + code, { method: "DELETE" });
    const result = await res.json();
    if (result.ok) {
      alert("商品已刪除");
      location.reload();
    }
  } catch (err) {
    alert("刪除失敗：" + err.message);
  }
}

window.onload = init;
</script>
</body>
</html>
