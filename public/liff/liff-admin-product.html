<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>上架商品</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #06c755; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>📦 新增團購商品</h2>
    <input id="nameInput" placeholder="商品名稱">
    <input id="priceInput" type="number" placeholder="單價">
    <input id="dateInput" type="date" placeholder="結單日期">
    <input id="colorInput" placeholder="規格 (如：紅色,藍色)">
    <input id="sizeInput" placeholder="尺寸 (如：S,M,L)">
    <select id="typeSelect">
        <option value="normal">預購 (Normal)</option>
        <option value="overstock">現貨 (Overstock)</option>
    </select>
    <input id="stockInput" type="number" placeholder="現貨初始庫存 (預購填0)">
    <input id="imagesInput" placeholder="圖片連結">
    <button onclick="submitProduct()">確認上架</button>

<script>
let adminUserId = "";

async function init() {
    await liff.init({ liffId: "你的LIFF_ID" });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    adminUserId = profile.userId;
}

async function submitProduct() {
    const body = {
        name: document.getElementById('nameInput').value,
        price: Number(document.getElementById('priceInput').value),
        closeDate: document.getElementById('dateInput').value,
        colorMap: `${document.getElementById('colorInput').value} | ${document.getElementById('sizeInput').value}`,
        type: document.getElementById('typeSelect').value,
        totalStock: Number(document.getElementById('stockInput').value),
        images: document.getElementById('imagesInput').value
    };

    const res = await fetch("/api/admin/products/create", {
        method: "POST",
        headers: { 
            "Content-Type": "application/json",
            "x-liff-user-id": adminUserId 
        },
        body: JSON.stringify(body)
    });

    if (res.ok) {
        alert("成功！");
        window.location.href = "liff-admin-dashboard.html";
    } else {
        alert("失敗，請檢查管理員權限");
    }
}
init();
</script>
</body>
</html>
