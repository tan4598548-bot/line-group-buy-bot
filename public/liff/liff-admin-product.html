<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>商品管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #fff; }
    .nav { margin-bottom: 15px; } .btn-back { color: #007bff; text-decoration: none; font-weight: bold; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 15px; background: #06c755; color: white; border: none; font-weight: bold; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="nav"><a href="liff-admin-dashboard.html" class="btn-back">❮ 返回管理中心</a></div>
  <h3>📦 商品上架/編輯</h3>
  <div class="form-group"><label>1. 商品名稱</label><input id="nameInput"></div>
  <div class="form-group"><label>2. 賣價</label><input id="priceInput" type="number"></div>
  <div class="form-group"><label>※ 成本 (計算利潤)</label><input id="costInput" type="number"></div>
  <div class="form-group"><label>3. 結單日期</label><input id="dateInput" type="date"></div>
  <div class="form-group"><label>4. 顏色/規格 (例: 紅,藍)</label><input id="colorInput" placeholder="多個請用逗號隔開"></div>
  <div class="form-group"><label>4. 尺寸 (例: S,M,L)</label><input id="sizeInput" placeholder="選填，多個請用逗號隔開"></div>
  <div class="form-group"><label>5. 詳細介紹</label><textarea id="descInput" rows="4"></textarea></div>
  <div class="form-group"><label>6. 圖片網址</label><input id="imagesInput"></div>
  <div class="form-group"><label>7. 影音連結</label><input id="ytInput"></div>
  <div class="form-group"><label>8. 類型</label><select id="typeSelect"><option value="normal">預購</option><option value="overstock">現貨</option></select></div>
  <button class="btn-submit" onclick="submitProduct()">💾 確認上架</button>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-jbKsKkPY" });
  if (!liff.isLoggedIn()) liff.login();
}
async function submitProduct() {
  const profile = await liff.getProfile();
  // 需求：規格分割。將顏色與尺寸合併為 API 接受的格式
  const colorMap = `${document.getElementById('colorInput').value}|${document.getElementById('sizeInput').value}`;
  
  const body = {
    productName: document.getElementById('nameInput').value,
    price: Number(document.getElementById('priceInput').value),
    cost: Number(document.getElementById('costInput').value),
    closeDate: document.getElementById('dateInput').value,
    colorMap: colorMap,
    detailText: document.getElementById('descInput').value,
    images: document.getElementById('imagesInput').value,
    youtube: document.getElementById('ytInput').value,
    type: document.getElementById('typeSelect').value
  };

  const res = await fetch("/api/admin/products/create", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-liff-user-id": profile.userId },
    body: JSON.stringify(body)
  });
  if (res.ok) { alert("上架成功！"); location.href="liff-admin-dashboard.html"; }
}
init();
</script>
</body>
</html>
