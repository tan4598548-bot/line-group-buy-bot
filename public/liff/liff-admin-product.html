<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
    .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-edit { background: #e7f3ff; color: #1877f2; }
    .btn-delete { background: #ffebe9; color: #fa3e3e; }
    /* 編輯視窗樣式 */
    #editModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center; }
    .modal-content { background:white; padding:20px; border-radius:12px; width:90%; max-width:400px; }
    input, select { width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3>📦 商品管理</h3>
    <button onclick="location.href='liff-admin-add-product.html'" style="background:#42b72a; color:white; border:none; padding:8px 15px; border-radius:6px;">+ 新增</button>
  </div>
  <div id="product-list">載入中...</div>

  <div id="editModal">
    <div class="modal-content">
      <h4 id="editTitle">修正商品</h4>
      <input type="hidden" id="editCode">
      <label>商品名稱</label><input type="text" id="editName">
      <label>單價</label><input type="number" id="editPrice">
      <label>結單日</label><input type="date" id="editDate">
      <label>狀態</label>
      <select id="editActive"><option value="TRUE">上架中</option><option value="FALSE">已下架</option></select>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn" onclick="closeModal()" style="background:#eee;">取消</button>
        <button class="btn" onclick="saveEdit()" style="background:#00c300; color:white;">儲存修正</button>
      </div>
    </div>
  </div>

<script>
let allProducts = [];
async function init() {
  await liff.init({ liffId: "2008857998-AoqmEajq" });
  loadProducts();
}

async function loadProducts() {
  const res = await fetch("/api/products");
  allProducts = await res.json();
  document.getElementById("product-list").innerHTML = allProducts.map(p => `
    <div class="product-card">
      <strong>${p.productName}</strong> (${p.productCode})<br>
      價格: $${p.price} | 結單: ${p.closeDate}<br>
      狀態: ${p.active === 'TRUE' ? '✅上架' : '❌下架'}
      <div class="actions">
        <button class="btn btn-edit" onclick="openEdit('${p.productCode}')">修正</button>
        <button class="btn btn-delete" onclick="deleteProduct('${p.productCode}')">刪除</button>
      </div>
    </div>
  `).join("");
}

function openEdit(code) {
  const p = allProducts.find(x => x.productCode === code);
  document.getElementById("editCode").value = p.productCode;
  document.getElementById("editName").value = p.productName;
  document.getElementById("editPrice").value = p.price;
  document.getElementById("editDate").value = p.closeDate;
  document.getElementById("editActive").value = p.active;
  document.getElementById("editModal").style.display = "flex";
}

function closeModal() { document.getElementById("editModal").style.display = "none"; }

async function saveEdit() {
  const code = document.getElementById("editCode").value;
  const data = {
    productName: document.getElementById("editName").value,
    price: document.getElementById("editPrice").value,
    closeDate: document.getElementById("editDate").value,
    active: document.getElementById("editActive").value
  };
  const res = await fetch("/api/products/" + code, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  if (res.ok) { alert("修正成功！"); closeModal(); loadProducts(); }
}

async function deleteProduct(code) {
  if (!confirm("確定刪除 " + code + "?")) return;
  await fetch("/api/products/" + code, { method: "DELETE" });
  loadProducts();
}
window.onload = init;
</script>
</body>
</html>
