<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>廠商管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f0f2f5; }
    .nav { margin-bottom: 15px; }
    .vendor-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .vendor-name { font-weight: bold; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .cost-info { color: #e44d26; font-size: 13px; margin-top: 5px; }
    .note-box { font-size: 12px; color: #666; background: #fdf6ec; padding: 5px; border-radius: 4px; margin-top: 8px; }
    .btn-action { background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="nav"><a href="liff-admin-dashboard.html" style="text-decoration:none;">❮ 返回主選單</a></div>
  <h3>🏢 廠商訂貨彙整 (Summary)</h3>
  <div id="vendorList">載入資料中...</div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-jbKsKkPY" });
  loadVendorSummary();
}
async function loadVendorSummary() {
  // 對接 Summary 工作表資料
  const res = await fetch("/api/admin/vendor-orders", { headers: { "x-liff-user-id": (await liff.getProfile()).userId } });
  const items = await res.json();
  const container = document.getElementById("vendorList");
  
  if(items.length === 0) { container.innerHTML = "尚無採購記錄"; return; }

  container.innerHTML = items.map(i => `
    <div class="vendor-card">
      <div class="vendor-name">
        <span>${i.product_name}</span>
        <button class="btn-action" onclick="alert('導出廠商訂單PDF')">導出單據</button>
      </div>
      <div style="font-size:14px;">規格: ${i.color} / 數量: <strong>${i.total_ordered}</strong></div>
      <div class="cost-info">預估總成本: $${i.subtotal_cost || (i.total_ordered * i.cost)}</div>
      <div class="note-box">廠商備註: ${i.vendor_note || '無'}</div>
    </div>
  `).join("");
}
init();
</script>
</body>
</html>
