<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>廠商管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f9f9f9; }
    .vendor-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #ff9500; }
  </style>
</head>
<body>
  <div class="nav"><a href="liff-admin-dashboard.html" style="text-decoration:none; font-weight:bold;">❮ 返回</a></div>
  <h3>🏢 廠商採購統計</h3>
  <div id="vendorSummary"></div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-jbKsKkPY" });
  const p = await liff.getProfile();
  const res = await fetch("/api/admin/vendor-orders", { headers: { "x-liff-user-id": p.userId } });
  const data = await res.json();
  document.getElementById("vendorSummary").innerHTML = data.map(d => `
    <div class="vendor-card">
      <strong>${d.product_name}</strong><br>
      總訂購量: ${d.total_ordered} | 成本單價: $${d.cost}<br>
      <small style="color:#666;">廠商備註: ${d.vendor_note || '無'}</small>
    </div>
  `).join("");
}
init();
</script>
</body>
</html>
