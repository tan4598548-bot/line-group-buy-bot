<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>發貨標籤產生器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 15px; background: #f0f2f5; }
    .btn-pdf { background: #00c300; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    /* 隱藏的標籤模板，專門給截圖用 */
    #pdf-template { position: absolute; left: -9999px; top: 0; }
    .label-box { width: 300px; height: 180px; padding: 20px; border: 2px solid #000; background: white; margin-bottom: 10px; }
    .label-name { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
    .label-item { font-size: 18px; color: #333; }
  </style>
</head>
<body>
  <h3>🖨 發貨管理 (中文支援)</h3>
  <div id="order-info">載入中...</div>
  <br>
  <button class="btn-pdf" id="pdfBtn" onclick="generateChinesePDF()">產生中文 PDF 標籤</button>

  <div id="pdf-template"></div>

<script>
    let readyOrders = [];
    async function init() {
      await liff.init({ liffId: "2008857998-A7Wv6re4" });
      const res = await fetch("/api/admin/orders");
      const data = await res.json();
      readyOrders = data.filter(o => o.status === '已到貨');
      document.getElementById("order-info").innerText = `目前有 ${readyOrders.length} 筆已到貨訂單可發貨`;
    }

    async function generateChinesePDF() {
      const btn = document.getElementById("pdfBtn");
      btn.innerText = "產生中...請稍候";
      btn.disabled = true;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', [100, 60]); // 標籤尺寸 100x60mm
      const template = document.getElementById("pdf-template");

      for (let i = 0; i < readyOrders.length; i++) {
        const o = readyOrders[i];
        // 1. 動態產出 HTML 內容
        template.innerHTML = `
          <div class="label-box" id="label-${i}">
            <div class="label-name">${o.buyerName}</div>
            <div class="label-item">商品：${o.productName}</div>
            <div class="label-item">數量：${o.qty}</div>
            <div style="margin-top:10px; font-size:12px;">編號：${o.orderId}</div>
          </div>
        `;

        // 2. 將 HTML 轉為 Canvas 圖片
        const canvas = await html2canvas(document.querySelector(`#label-${i}`), { scale: 2 });
        const imgData = canvas.toDataURL('image/jpeg', 1.0);

        // 3. 加入 PDF
        if (i > 0) pdf.addPage([100, 60], 'l');
        pdf.addImage(imgData, 'JPEG', 0, 0, 100, 60);
      }

      pdf.save("發貨標籤.pdf");
      btn.innerText = "產生完成";
      btn.disabled = false;
    }
    window.onload = init;
</script>
</body>
</html>
