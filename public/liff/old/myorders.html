<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>我的訂單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    h2 { margin-top: 0; }
    .item {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <h2>📦 我的訂單</h2>
  <div id="list">讀取中...</div>

  <script>
    async function init() {
      await liff.init({ liffId: 'YOUR_LIFF_ID' });
      const profile = await liff.getProfile();

      const res = await fetch(`/api/liff/myOrders?userId=${profile.userId}`);
      const orders = await res.json();

      const list = document.getElementById('list');
      list.innerHTML = '';

      if (orders.length === 0) {
        list.innerText = '目前尚無訂單';
        return;
      }

      orders.forEach(o => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText =
          `${o.productCode} ${o.productName}\n` +
          `顏色：(${o.colorCode}) ${o.colorName}\n` +
          `尺寸：${o.size || '-'}｜數量：${o.qty}`;
        list.appendChild(div);
      });
    }

    init();
  </script>
</body>
</html>
