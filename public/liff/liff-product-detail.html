<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>商品詳情</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding-bottom: 80px; }
    .img-box img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .content { padding: 20px; }
    .price { color: #e44d26; font-size: 26px; font-weight: bold; }
    .footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: white; border-top: 1px solid #eee; text-align: center; }
    .btn { width: 90%; height: 50px; background: #06c755; color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; }
    .btn:disabled { background: #ccc; }
    select, input { width: 100%; height: 45px; margin-top: 10px; border-radius: 6px; border: 1px solid #ddd; padding: 0 10px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="media" class="img-box"></div>
  <div class="content">
    <div id="pPrice" class="price"></div>
    <h2 id="pName">載入中...</h2>
    <p id="pDesc" style="color:#666; font-size:14px;"></p>
    <hr>
    <label>選擇規格</label>
    <select id="specSelect"></select>
    <label style="display:block; margin-top:15px;">下單數量</label>
    <input type="number" id="qty" value="1" min="1">
  </div>
  <div class="footer"><button id="btn" class="btn" onclick="submit()">🛒 確認下單</button></div>

<script>
let p, user;
async function init() {
  await liff.init({ liffId: "2008857998-qOI2DqCC" });
  if(!liff.isLoggedIn()) { liff.login(); return; }
  user = await liff.getProfile();
  const code = new URLSearchParams(window.location.search).get('code');
  const res = await fetch("/api/products");
  const prods = await res.json();
  p = prods.find(x => x.productCode === code);
  
  document.getElementById('pName').innerText = p.productName;
  document.getElementById('pPrice').innerText = "$" + p.price;
  document.getElementById('media').innerHTML = `<img src="${p.images?.split(',')[0] || ''}">`;
  
  // 規格處理 (假設 specSize 格式為 "規格:紅,藍 | 尺寸:S,M")
  const sel = document.getElementById('specSelect');
  if(p.specSize) {
    p.specSize.split('|').forEach(group => {
      const items = group.split(':')[1]?.split(',') || [];
      items.forEach(i => sel.innerHTML += `<option value="${i.trim()}">${i.trim()}</option>`);
    });
  } else { sel.innerHTML = '<option value="單一規格">單一規格</option>'; }

  // 結單攔截
  if (p.status === '已結單' || p.status === '斷貨') {
    const b = document.getElementById('btn');
    b.disabled = true; b.innerText = "本商品已停止收單";
  }
}
async function submit() {
  const b = document.getElementById('btn');
  b.disabled = true; b.innerText = "處理中...";
  const body = {
    buyerId: user.userId, buyerName: user.displayName, productCode: p.productCode,
    productName: p.productName, spec: document.getElementById('specSelect').value,
    qty: parseInt(document.getElementById('qty').value), price: p.price,
    total: p.price * parseInt(document.getElementById('qty').value)
  };
  const res = await fetch('/api/admin/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if(res.ok) { alert("下單成功！"); location.href = "liff-buyer-orders.html"; }
  else { alert("下單失敗"); b.disabled = false; }
}
window.onload = init;
</script>
</body>
</html>
