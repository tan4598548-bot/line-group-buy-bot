<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>商品詳情</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        .back-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.5); color: white; border: none; padding: 8px 12px; border-radius: 20px; }
        .hero { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .content { padding: 15px; }
        .section { margin-top: 20px; }
        select, input { width: 100%; height: 45px; border-radius: 8px; border: 1px solid #ddd; padding: 0 10px; font-size: 16px; margin-top: 8px; }
        .footer { position: fixed; bottom: 0; width: 100%; padding: 10px; background: white; border-top: 1px solid #eee; }
        .btn-submit { width: 100%; height: 50px; background: #06c755; color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='liff-product-list.html'">⬅ 返回</button>
    <img id="pImg" class="hero" src="">
    <div class="content">
        <h2 id="pName" style="margin:0;">載入中...</h2>
        <div id="pPrice" style="color:#e44d26; font-size:24px; font-weight:bold; margin:10px 0;"></div>
        <div id="pDate" style="color:#d9534f; font-size:13px;"></div>
        
        <div class="section">
            <label><strong>請選擇商品規格/尺寸 (必選)</strong></label>
            <select id="specSelect">
                <option value="WAIT_SELECT">-- 請點擊選擇規格與尺寸 --</option>
            </select>
        </div>

        <div class="section">
            <label><strong>訂購數量</strong></label>
            <input type="number" id="qty" value="1" min="1">
        </div>
    </div>

    <div class="footer">
        <button id="btn" class="btn-submit" onclick="submitOrder()">🛒 確認提交訂單</button>
    </div>

<script>
    let pObj, user;
    async function init() {
        await liff.init({ liffId: "2008857998-qOI2DqCC" });
        if(!liff.isLoggedIn()) { liff.login(); return; }
        user = await liff.getProfile();
        
        const code = new URLSearchParams(window.location.search).get('code');
        const res = await fetch("/api/products");
        const list = await res.json();
        pObj = list.find(x => x.productCode === code);

        document.getElementById('pImg').src = pObj.images?.split(',')[0] || '';
        document.getElementById('pName').innerText = pObj.productName;
        document.getElementById('pPrice').innerText = "$" + pObj.price;
        document.getElementById('pDate').innerText = "📅 結單日期：" + (pObj.closeDate ? pObj.closeDate.split('T')[0] : "不限時");

        const sel = document.getElementById('specSelect');
        if(pObj.specSize) {
            pObj.specSize.split(',').forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.trim();
                opt.innerText = s.trim();
                sel.appendChild(opt);
            });
        }
    }

    async function submitOrder() {
        const spec = document.getElementById('specSelect').value;
        
        // 嚴格檢查：如果是預設值或空值，攔截下單
        if(spec === "WAIT_SELECT" || !spec) {
            alert("❌ 請務必選擇正確的規格與尺寸！");
            return;
        }

        const b = document.getElementById('btn');
        b.disabled = true; b.innerText = "傳送中...";

        const payload = {
            buyerId: user.userId,
            buyerName: user.displayName,
            productCode: pObj.productCode,
            productName: pObj.productName,
            spec: spec,
            qty: parseInt(document.getElementById('qty').value),
            price: pObj.price,
            total: pObj.price * parseInt(document.getElementById('qty').value),
            status: '待點貨'
        };

        const res = await fetch('/api/admin/orders', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if(res.ok) {
            alert("下單成功！");
            location.href = "liff-buyer-orders.html";
        } else {
            alert("下單失敗");
            b.disabled = false; b.innerText = "🛒 確認提交訂單";
        }
    }
    window.onload = init;
</script>
</body>
</html>
