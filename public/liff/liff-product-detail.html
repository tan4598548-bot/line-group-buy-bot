<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>商品下單</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        .back-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.5); color:white; border:none; padding:8px 15px; border-radius:20px; }
        .hero { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .section { padding: 15px; }
        .price { color: #e44d26; font-size: 24px; font-weight: bold; }
        select, input { width: 100%; height: 45px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        .footer { position: fixed; bottom: 0; width: 100%; padding: 10px; background: white; border-top: 1px solid #eee; }
        .btn-buy { width: 100%; height: 50px; background: #06c755; color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='liff-product-list.html'">⬅ 返回商城</button>
    <img id="pImg" class="hero" src="">
    <div class="section">
        <h2 id="pName">載入中...</h2>
        <div id="pPrice" class="price"></div>
        <div id="pDate" style="color:#d9534f; margin-top:5px;"></div>
        
        <div style="margin-top:20px;">
            <label><strong>請選擇規格與尺寸 (必選)</strong></label>
            <select id="specSelect">
                <option value="NOT_SELECTED">-- 請選擇：規格(顏色)/尺寸 --</option>
            </select>
        </div>

        <div style="margin-top:20px;">
            <label><strong>購買數量</strong></label>
            <input type="number" id="qty" value="1" min="1">
        </div>
    </div>

    <div class="footer"><button id="btn" class="btn-buy" onclick="submit()">🛒 確認送出訂單</button></div>

<script>
    let product, user;
    async function init() {
        try {
            await liff.init({ liffId: "2008857998-qO12DqCC" }); [cite: 136]
            if(!liff.isLoggedIn()) { liff.login(); return; }
            user = await liff.getProfile();
            
            const code = new URLSearchParams(window.location.search).get('code');
            const res = await fetch("/api/products");
            const list = await res.json();
            product = list.find(x => x.productCode === code);

            document.getElementById('pImg').src = product.images?.split(',')[0] || '';
            document.getElementById('pName').innerText = product.productName;
            document.getElementById('pPrice').innerText = "$" + product.price;
            document.getElementById('pDate').innerText = "⏳ 結單日：" + (product.closeDate ? product.closeDate.split('T')[0] : "不限時"); [cite: 34]

            // 處理合併規格選單 (格式: 紅/S,紅/M,藍/S...) [cite: 35, 36, 186]
            const sel = document.getElementById('specSelect');
            if(product.specSize) {
                product.specSize.split(',').forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.trim();
                    opt.innerText = s.trim();
                    sel.appendChild(opt);
                });
            }
        } catch (e) { alert("LIFF 初始化失敗"); }
    }

    async function submit() {
        const spec = document.getElementById('specSelect').value;
        
        // 嚴格驗證：必須同時包含斜線或其他分隔符，且不能是預設值 
        if(spec === "NOT_SELECTED" || !spec.includes('/')) {
            alert("❌ 請務必選定具體的「規格」與「尺寸」！\n(例如：紅/L)");
            return;
        }

        const b = document.getElementById('btn');
        b.disabled = true; b.innerText = "下單中...";

        const payload = {
            buyerId: user.userId,
            buyerName: user.displayName,
            productCode: product.productCode,
            productName: product.productName,
            spec: spec,
            qty: parseInt(document.getElementById('qty').value),
            price: product.price,
            total: product.price * parseInt(document.getElementById('qty').value),
            status: '待點貨' [cite: 223]
        };

        const res = await fetch('/api/admin/orders', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if(res.ok) {
            alert("🎉 下單成功！");
            location.href = "liff-buyer-orders.html";
        } else {
            alert("下單失敗");
            b.disabled = false;
        }
    }
    window.onload = init;
</script>
</body>
</html>
