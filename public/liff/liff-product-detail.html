<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品下單詳情</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --primary-color: #06c755; --price-color: #e44d26; }
        body { font-family: -apple-system, sans-serif; background: #fff; margin: 0; padding-bottom: 80px; }
        .nav-top { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 10; }
        .back-btn { text-decoration: none; font-size: 20px; color: #333; margin-right: 15px; }
        .media-box { width: 100%; background: #000; }
        .media-box img, .media-box iframe { width: 100%; aspect-ratio: 16 / 9; display: block; border: none; object-fit: cover; }
        .content-card { padding: 20px; }
        .price-tag { font-size: 26px; color: var(--price-color); font-weight: bold; margin-bottom: 10px; }
        .price-tag::before { content: "$"; font-size: 18px; margin-right: 2px; }
        .product-title { font-size: 22px; font-weight: bold; line-height: 1.4; margin-bottom: 15px; color: #222; }
        .selector-box { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px solid #f0f0f0; }
        .spec-label { font-size: 13px; color: #888; margin-bottom: 8px; display: block; font-weight: bold; }
        select, input { width: 100%; height: 48px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; }
        .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px 16px; border-top: 1px solid #eee; display: flex; }
        .btn-submit { flex: 1; height: 50px; background: var(--primary-color); color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="nav-top">
        <a href="liff-order.html" class="back-btn">⬅</a>
        <span style="font-weight:bold;">商品下單詳情</span>
    </div>

    <div id="mediaContainer" class="media-box"></div>

    <div class="content-card">
        <div id="pPrice" class="price-tag">0</div>
        <div id="pName" class="product-title">載入中...</div>
        
        <div class="selector-box">
            <div id="colorArea">
                <span class="spec-label">選擇顏色</span>
                <select id="colorSel"><option value="">請選擇顏色</option></select>
            </div>
            <div id="sizeArea">
                <span class="spec-label">選擇尺寸</span>
                <select id="sizeSel"><option value="">請選擇尺寸</option></select>
            </div>
            
            <span class="spec-label">購買數量</span>
            <input type="number" id="qtyInput" value="1" min="1">
        </div>

        <div class="section-title">商品介紹</div>
        <div id="pDesc" class="description-box"></div>
    </div>

    <div class="footer-bar">
        <button id="submitBtn" class="btn-submit" onclick="submitOrder()">🛒 確認下單</button>
    </div>

<script>
let product = null;
let user = {};

async function init() {
    // 根據您的 LIFF ID 清單，第 12 項為詳情頁
    await liff.init({ liffId: "2008857998-qOI2DqCC" });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    user = { id: profile.userId, name: profile.displayName };

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const res = await fetch("/api/products");
    const products = await res.json();
    product = products.find(p => p.productCode === code);

    if (product) render();
}

function render() {
    document.getElementById('pName').innerText = product.productName;
    document.getElementById('pPrice').innerText = product.price;
    document.getElementById('pDesc').innerText = product.description || "目前尚無詳細說明。";

    const media = document.getElementById('mediaContainer');
    if (product.youtube) {
        const vid = product.youtube.includes('v=') ? product.youtube.split('v=')[1].split('&')[0] : product.youtube.split('/').pop();
        media.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`;
    } else {
        const images = product.images ? product.images.split(',') : [];
        media.innerHTML = `<img src="${images[0] || 'https://via.placeholder.com/800x450'}">`;
    }

    const colorSel = document.getElementById('colorSel');
    const sizeSel = document.getElementById('sizeSel');
    
    // 清空並加入預設選項
    colorSel.innerHTML = '<option value="">請選擇顏色</option>';
    sizeSel.innerHTML = '<option value="">請選擇尺寸</option>';

    // 規格拆分核心邏輯
    if (product.specSize && product.specSize.includes('|')) {
        const parts = product.specSize.split('|');
        
        parts.forEach(part => {
            if (part.includes('規格:')) {
                // 去除「規格:」字串，並依照逗號拆分
                const colors = part.split(':')[1].trim().split(',').filter(s => s);
                colorSel.innerHTML += colors.map(c => `<option value="${c}">${c}</option>`).join('');
            } 
            if (part.includes('尺寸:')) {
                const sizes = part.split(':')[1].trim().split(',').filter(s => s);
                sizeSel.innerHTML += sizes.map(s => `<option value="${s}">${s}</option>`).join('');
            }
        });
    } else {
        // 若格式不符，視為單一規格
        colorSel.innerHTML = `<option value="單一規格">單一規格</option>`;
        document.getElementById('sizeArea').style.display = 'none';
    }

    if (product.status === '已結單') {
        const btn = document.getElementById('submitBtn');
        btn.innerText = "已結單 (停止收單)";
        btn.disabled = true;
    }
}

async function submitOrder() {
    const qty = parseInt(document.getElementById('qtyInput').value);
    const colorVal = document.getElementById('colorSel').value;
    const sizeVal = document.getElementById('sizeSel').value;
    const isSizeVisible = document.getElementById('sizeArea').style.display !== 'none';

    // 防呆校驗
    if (colorVal === "") return alert("⚠️ 請選擇顏色！");
    if (isSizeVisible && sizeVal === "") return alert("⚠️ 請選擇尺寸！");
    if (!qty || qty < 1) return alert("⚠️ 請輸入購買數量！");

    const finalSpec = isSizeVisible ? `${colorVal} / ${sizeVal}` : colorVal;

    // Payload 必須對應 sheetService.appendOrder 的要求
    const payload = {
        orderId: `ORD${Date.now()}`,
        buyerId: user.id,
        buyerName: user.name,
        productCode: product.productCode,
        productName: product.productName,
        spec: finalSpec,
        qty: qty,
        price: product.price,
        total: product.price * qty,
        orderDate: new Date().toLocaleDateString('zh-TW'),
        status: '待點貨'
    };

    try {
        const res = await fetch('/api/admin/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("✅ 下單成功！系統將轉跳至您的訂單紀錄。");
            window.location.href = "liff-buyer-orders.html";
        } else {
            const errorData = await res.json();
            alert("❌ 下單失敗：" + (errorData.error || "伺服器錯誤"));
        }
    } catch (err) {
        alert("❌ 網路錯誤，請稍後再試");
    }
}
window.onload = init;
</script>
</body>
</html>
