<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>發貨作業</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f7f6; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-pdf { background: #007bff; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 20px; }
    .checkbox-container { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <h3>🚚 發貨作業 (產單)</h3>
  <div id="order-list">⌛ 載入發貨清單中...</div>
  <button class="btn-pdf" onclick="generatePDF()">🖨️ 產生發貨小紙張</button>

<script>
async function init() {
  try {
    await liff.init({ liffId: "2008857998-HUEXLkgO" }); // 對應 shipping.html
    const res = await fetch("/api/admin/orders");
    const orders = await res.json();
    
    // 過濾出狀態為「已到貨」的訂單進行發貨
    const list = document.getElementById("order-list");
    list.innerHTML = orders.map(o => `
      <div class="card">
        <div class="checkbox-container">
          <div>
            <strong>${o.productName}</strong><br>
            買家: ${o.buyerName} | 數量: ${o.qty}
          </div>
          <input type="checkbox" name="orderSelect" value="${o.orderId}">
        </div>
      </div>
    `).join("");
  } catch (err) {
    document.getElementById("order-list").innerText = "載入失敗: " + err.message;
  }
}

async function generatePDF() {
  const selected = Array.from(document.querySelectorAll('input[name="orderSelect"]:checked')).map(el => el.value);
  if (selected.length === 0) return alert("請至少勾選一筆訂單！");

  const res = await fetch("/api/admin/generate-shipping-pdf", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ orderIds: selected })
  });
  
  const data = await res.json();
  if (data.ok) {
    window.location.href = data.downloadUrl; // 導向模擬 PDF 頁面，解決 404
  }
}
window.onload = init;
</script>
</body>
</html>
