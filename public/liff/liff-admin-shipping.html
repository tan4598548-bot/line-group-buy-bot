<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>發貨作業</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f7f6; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .btn-pdf { background: #007bff; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; position: fixed; bottom: 20px; left: 5%; width: 90%; }
  </style>
</head>
<body>
  <button onclick="location.href='liff-admin-dashboard.html'">⬅ 返回</button>
  <h3>🚚 待發貨清單 (已到貨商品)</h3>
  <div id="list" style="padding-bottom: 80px;">載入中...</div>
  <button class="btn-pdf" onclick="generate()">🖨️ 產生發貨標籤/清單</button>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-HUEXLkgO" });
  const res = await fetch("/api/admin/orders");
  const data = await res.json();
  document.getElementById("list").innerHTML = data.filter(o => o.status === '已到貨').map(o => `
    <div class="card">
      <input type="checkbox" name="os" value="${o.orderId}" checked>
      <div><strong>${o.buyerName}</strong><br><small>${o.productName} x ${o.qty}</small></div>
    </div>
  `).join("") || "目前沒有已到貨的訂單";
}
async function generate() {
  const ids = Array.from(document.querySelectorAll('input[name="os"]:checked')).map(el => el.value);
  if(ids.length === 0) return alert("請勾選訂單");
  // 呼叫後端產生 PDF 或 出貨小紙張 API
  alert("正在為 " + ids.length + " 筆訂單產生發貨單...");
}
window.onload = init;
</script>
</body>
</html>
