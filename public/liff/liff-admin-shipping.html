<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>發貨列印</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .order-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    button { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>🚚 出貨發貨清單</h2>
  <div id="list">載入中...</div>
  <button onclick="ship()">📄 產生發貨 PDF</button>

<script>
let adminUserId = "";
let orders = [];

async function init() {
  await liff.init({ liffId: "2008857998-HUEXLkgO" });
  if (!liff.isLoggedIn()) { liff.login(); return; }
  const profile = await liff.getProfile();
  adminUserId = profile.userId;

  const res = await fetch("/api/admin/shipping-list", {
    headers: { "x-liff-user-id": adminUserId }
  });

  if (!res.ok) {
    alert("權限錯誤");
    liff.closeWindow();
    return;
  }

  orders = await res.json();
  render();
}

function render() {
  const el = document.getElementById("list");
  if(orders.length === 0) { el.innerHTML = "無待出貨訂單"; return; }
  el.innerHTML = orders.map(o => `
    <div class="order-item">
      <label>
        <input type="checkbox" value="${o.orderId}">
        <strong>${o.buyerName}</strong>: ${o.productName} (${o.qty}件)
      </label>
    </div>
  `).join("");
}

async function ship() {
  const ids = [...document.querySelectorAll("input:checked")].map(i => i.value);
  if (!ids.length) return alert("請選擇訂單");

  const res = await fetch("/api/admin/ship", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "x-liff-user-id": adminUserId 
    },
    body: JSON.stringify({ orderIds: ids })
  });

  const data = await res.json();
  if(data.pdfUrl) {
    window.open(data.pdfUrl, "_blank");
    location.reload();
  } else {
    alert("產生失敗");
  }
}
init();
</script>
</body>
</html>
