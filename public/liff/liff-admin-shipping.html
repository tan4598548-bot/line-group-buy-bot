<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>發貨作業單</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
    .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 12px; border-top: 4px solid #007bff; }
    .status-tag { float: right; background: #d4edda; color: #155724; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
    .title { font-weight: bold; font-size: 16px; margin-bottom: 8px; display: block; }
    .desc { font-size: 13px; color: #666; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-pdf { background: #6c757d; color: white; }
    .btn-ship { background: #007bff; color: white; }
  </style>
</head>
<body>

  <h3 style="margin-top:0;">📋 待發貨清單 (已到齊)</h3>
  <div id="list">正在同步資料...</div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-HUEXLkgO" });
  if (!liff.isLoggedIn()) { liff.login(); return; }
  loadShippingData();
}

async function loadShippingData() {
  const res = await fetch('/api/admin/vendor-orders');
  const data = await res.json();
  const listDiv = document.getElementById('list');

  // 只顯示狀態為「已齊全」的項目
  const readyItems = data.filter(d => d.status === '已齊全');

  if (readyItems.length === 0) {
    listDiv.innerHTML = '<div style="text-align:center; padding-top:50px; color:#999;">目前沒有待發貨商品</div>';
    return;
  }

  listDiv.innerHTML = readyItems.map(d => `
    <div class="card">
      <span class="status-tag">貨物已齊全</span>
      <span class="title">${d.productName}</span>
      <div class="desc">
        規格：<b>${d.spec}</b><br>
        到貨總數：${d.arrivedQty} 件
      </div>
      <div class="btn-group">
        <button class="btn-pdf" onclick="downloadPDF('${d.productCode}','${d.spec}')">📥 下載揀貨單</button>
        <button class="btn-ship" onclick="markShipped('${d.productCode}','${d.spec}')">✅ 標記為已發貨</button>
      </div>
    </div>
  `).join('');
}

function downloadPDF(code, spec) {
  // 導向 API 觸發 PDF 下載
  window.open(`/api/admin/shipping/export-pdf?productCode=${code}&spec=${spec}`, '_blank');
}

async function markShipped(code, spec) {
  if (!confirm(`確定要將「${spec}」的所有訂單標記為「已到貨」並通知買家嗎？`)) return;

  const res = await fetch('/api/admin/shipping/mark-done', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ productCode: code, spec: spec })
  });

  if (res.ok) {
    alert("狀態更新完成！");
    loadShippingData();
  }
}

window.onload = init;
</script>
</body>
</html>
