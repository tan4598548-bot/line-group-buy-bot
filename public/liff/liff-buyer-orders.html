<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>商品清單</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f4f7; padding: 15px; margin: 0; }
    h3 { color: #333; border-left: 5px solid #06c755; padding-left: 10px; margin-bottom: 20px; }
    .list-container { display: flex; flex-direction: column; gap: 12px; }
    .list-item { 
      background: white; border-radius: 12px; padding: 12px; display: flex; 
      align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; color: inherit;
    }
    .list-item:active { background: #f9f9f9; }
    .list-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: #eee; margin-right: 15px; }
    .list-content { flex: 1; }
    .list-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; color: #222; }
    .list-price { color: #e44d26; font-weight: bold; font-size: 15px; }
    .badge { font-size: 10px; background: #007bff; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 5px; vertical-align: middle; }
  </style>
</head>
<body>
  <h3>🛒 目前開團商品</h3>
  <div id="products" class="list-container">載入中...</div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-jbKsKkPY" });
  loadProducts();
}
async function loadProducts() {
  const res = await fetch("/api/products");
  const products = await res.json();
  const active = products.filter(p => p.active);
  const container = document.getElementById("products");
  
  if(active.length === 0) { container.innerHTML = "目前暫無上架商品"; return; }

  container.innerHTML = active.map(p => {
    const img = p.images ? p.images.split(',')[0] : 'https://via.placeholder.com/80 px';
    return `
      <a href="liff-order.html?code=${p.productCode}" class="list-item">
        <img src="${img}" class="list-img">
        <div class="list-content">
          <div class="list-title">
            ${p.type === 'overstock' ? '<span class="badge" style="background:#ff9500">現貨</span>' : '<span class="badge">預購</span>'}
            ${p.productName}
          </div>
          <div class="list-price">$${p.price}</div>
        </div>
        <div style="color:#ccc;">❯</div>
      </a>
    `;
  }).join("");
}
init();
</script>
</body>
</html>
