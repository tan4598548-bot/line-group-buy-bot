<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>商品訂購列表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    .header { margin-bottom: 20px; text-align: center; }
    .list-container { display: flex; flex-direction: column; gap: 10px; }
    .product-row { 
      background: white; border-radius: 12px; padding: 12px; display: flex; 
      align-items: center; text-decoration: none; color: inherit; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .p-img { width: 65px; height: 65px; border-radius: 8px; object-fit: cover; margin-right: 12px; background: #eee; }
    .p-info { flex: 1; }
    .p-name { font-weight: bold; font-size: 15px; margin-bottom: 4px; color: #333; line-height: 1.4; }
    .p-price { color: #e44d26; font-weight: bold; font-size: 14px; }
    .p-tag { font-size: 10px; background: #06c755; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    .arrow { color: #ccc; font-size: 18px; margin-left: 10px; }
  </style>
</head>
<body>
  <div class="header"><h3>🛒 當前團購清單</h3></div>
  <div id="productList" class="list-container">載入中...</div>

<script>
async function init() {
  await liff.init({ liffId: "2008857998-jbKsKkPY" });
  loadProducts();
}
async function loadProducts() {
  try {
    const res = await fetch("/api/products");
    const products = await res.json();
    const active = products.filter(p => p.active === true || p.active === 'TRUE');
    const container = document.getElementById("productList");

    if(active.length === 0) { container.innerHTML = "目前暫無開團商品"; return; }

    container.innerHTML = active.map(p => {
      const img = p.images ? p.images.split(',')[0] : '';
      return `
        <a href="liff-order.html?code=${p.productCode}" class="product-row">
          <img src="${img || 'https://via.placeholder.com/65'}" class="p-img">
          <div class="p-info">
            <div class="p-name">${p.type === 'overstock' ? '<span class="p-tag" style="background:#ff9500">現貨</span>' : '<span class="p-tag">預購</span>'}${p.productName}</div>
            <div class="p-price">$${p.price}</div>
          </div>
          <div class="arrow">❯</div>
        </a>
      `;
    }).join("");
  } catch(e) { document.getElementById("productList").innerHTML = "資料讀取錯誤"; }
}
init();
</script>
</body>
</html>
