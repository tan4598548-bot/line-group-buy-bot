<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的訂購紀錄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --primary-color: #06c755; --danger-color: #dc3545; --bg: #f8f9fa; --price-color: #e44d26; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .nav-bar { display: flex; align-items: center; margin-bottom: 20px; position: sticky; top: 0; background: var(--bg); padding: 5px 0; z-index: 10; }
        .order-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 10px; }
        .order-status { font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 4px; background: #e9ecef; }
        .status-warning { color: #856404; background: #fff3cd; } 
        .status-success { color: #155724; background: #d4edda; } 
        .status-danger { color: #721c24; background: #f8d7da; }
        .order-name { font-weight: bold; font-size: 15px; margin-bottom: 5px; color: #333; }
        .order-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #eee; }
        .btn-sm { padding: 8px 16px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; cursor: pointer; font-weight: bold; transition: 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .btn-edit { color: var(--primary-color); border-color: var(--primary-color); background: #fff; }
        .btn-del { color: var(--danger-color); border-color: var(--danger-color); background: #fff; }
        .locked-msg { font-size: 12px; color: #d9534f; text-align: center; margin-top: 10px; background: #fff1f0; padding: 8px; border-radius: 6px; border: 1px solid #ffa39e; font-weight: bold; }
        #loading { text-align: center; padding: 50px; color: #999; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="liff-product-list.html" style="text-decoration:none; color:#666; margin-right:10px; font-size: 24px;">⬅</a>
        <h3 style="margin:0;">📋 我的訂購紀錄</h3>
    </div>
    
    <div id="loading">🔍 正在讀取訂單資料...</div>
    <div id="order-list"></div>

<script>
let userProfile = null;

async function init() {
    try {
        await liff.init({ liffId: "2008857998-jbKsKkPY" });
        if (!liff.isLoggedIn()) { 
            liff.login(); 
            return; 
        }
        userProfile = await liff.getProfile();
        fetchOrders();
    } catch (err) { 
        document.getElementById("loading").innerText = "LIFF 初始化失敗";
        console.error(err); 
    }
}

async function fetchOrders() {
    try {
        const [ordersRes, productsRes] = await Promise.all([
            fetch(`/api/admin/orders?userId=${userProfile.userId}&t=${Date.now()}`),
            fetch(`/api/products?t=${Date.now()}`)
        ]);
        
        const myOrders = await ordersRes.json();
        const allProducts = await productsRes.json();
        
        document.getElementById("loading").style.display = "none";

        if (!myOrders || myOrders.length === 0) {
            document.getElementById("order-list").innerHTML = '<div style="text-align:center; color:#999; padding:50px;">目前尚無訂單紀錄</div>';
            return;
        }

        document.getElementById("order-list").innerHTML = myOrders.map(order => {
            let canModify = true;
            let lockReason = "";

            const product = allProducts.find(p => String(p.productCode) === String(order.productCode));
            const isProductClosed = product && (product.status === '已結單' || product.status === '斷貨');
            
            if (isProductClosed) {
                canModify = false;
                lockReason = product.status === '斷貨' ? "❌ 此商品已斷貨" : "⚠️ 團主已結單，訂單鎖定中";
            }

            // 狀態過濾與鎖定判斷
            if (order.status === '買家取消' || order.status === '已刪除') {
                return ''; // 如果後端沒過濾掉，前端雙重保障不顯示
            } else if (order.status === '已到貨' || order.status === '已收貨') {
                canModify = false;
                lockReason = "✅ 商品已抵達，無法修改";
            }

            let statusClass = 'status-warning';
            if (order.status === '已到貨' || order.status === '已收貨') statusClass = 'status-success';
            if (order.status === '斷貨') statusClass = 'status-danger';

            return `
                <div class="order-card">
                    <div class="order-header">
                        <span style="font-size:11px; color:#999;">訂單編號: ${order.orderId ? order.orderId.slice(-8).toUpperCase() : 'N/A'}</span>
                        <span class="order-status ${statusClass}">${order.status}</span>
                    </div>
                    <div class="order-name">${order.productName}</div>
                    <div style="font-size:13px; color:#666; margin-top:4px;">規格: ${order.spec}</div>
                    <div style="font-size:13px; color:#666; margin-top:2px;">數量: ${order.qty} / 單價: $${order.price}</div>
                    <div style="color:var(--price-color); font-weight:bold; margin-top:8px; font-size:16px;">總計: $${order.total}</div>
                    
                    ${canModify ? `
                        <div class="order-footer">
                            <button class="btn-sm btn-edit" onclick="editOrder('${order.orderId}', ${order.qty})">修改數量</button>
                            <button class="btn-sm btn-del" onclick="deleteOrder('${order.orderId}')">取消訂單</button>
                        </div>
                    ` : `
                        <div class="locked-msg">${lockReason}</div>
                    `}
                </div>
            `;
        }).join("");
    } catch (err) { 
        console.error("Fetch Error:", err);
        document.getElementById("order-list").innerHTML = '<div style="text-align:center; padding:20px; color:red;">資料載入異常，請重整頁面</div>';
    }
}

async function editOrder(orderId, oldQty) {
    const input = prompt("請輸入新的購買數量:", oldQty);
    if (input === null || input == oldQty) return;
    
    const newQty = parseInt(input);
    if (isNaN(newQty) || newQty <= 0) {
        alert("請輸入正確的數字");
        return;
    }
    
    try {
        const res = await fetch(`/api/admin/orders/${orderId}/status`, {
            method: 'PUT', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                qty: newQty, 
                status: '待點貨' 
            })
        });
        if (res.ok) {
            alert("訂單數量已更新");
            fetchOrders();
        } else {
            const errData = await res.json();
            alert(errData.error || "修改失敗，可能該團已結單");
        }
    } catch (e) { alert("系統忙碌中，請稍後再試"); }
}

async function deleteOrder(orderId) {
    if (!confirm("確定要取消這筆訂單嗎？\n取消後該筆記錄將直接移除。")) return;
    try {
        const res = await fetch(`/api/admin/orders/${orderId}/status`, {
            method: 'PUT', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: '買家取消' })
        });
        if (res.ok) {
            alert("訂單已成功取消");
            fetchOrders(); // 此處重新讀取，取消的訂單會消失
        } else {
            const errData = await res.json();
            alert(errData.error || "取消失敗");
        }
    } catch (e) { alert("操作失敗"); }
}

window.onload = init;
</script>
</body>
</html>
