<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>溢多商品管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<h2>📦 溢多商品管理</h2>

<h3>➕ 新增現貨</h3>
<input id="name" placeholder="商品名">
<input id="color" placeholder="顏色">
<input id="size" placeholder="尺寸">
<input id="price" placeholder="價格">
<input id="qty" placeholder="數量">
<button onclick="add()">新增</button>

<hr>
<h3>📋 清單</h3>
<div id="list"></div>

<script>
liff.init({ liffId: "2008857998-qCQWSTKf" }).then(load);

async function load() {
  const res = await fetch("/api/overstock/admin");
  const items = await res.json();
  document.getElementById("list").innerHTML =
    items.map(i => `
      <div>
        ${i.product_name} (${i.qty}) - ${i.status}
        <button onclick="closeItem('${i.overstock_id}')">關閉</button>
      </div>
    `).join("");
}

async function add() {
  await fetch("/api/overstock/admin/create", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: name.value,
      color: color.value,
      size: size.value,
      price: price.value,
      qty: qty.value
    })
  });
  load();
}

async function closeItem(id) {
  await fetch("/api/overstock/admin/close", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ overstockId: id })
  });
  load();
}
</script>
</body>
</html>
