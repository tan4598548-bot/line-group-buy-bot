<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>出貨勾選</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<h3>🚚 出貨勾選</h3>
<div id="list"></div>
<button onclick="ship()">產生出貨單</button>

<script>
let orders = [];

async function load() {
  const res = await fetch('/api/shippingOrders');
  orders = await res.json();

  const el = document.getElementById('list');
  orders.forEach(o => {
    el.innerHTML += `
      <div>
        <input type="checkbox" value="${o.id}">
        ${o.product} ${o.color} ${o.size} x ${o.qty}
      </div>
    `;
  });
}

async function ship() {
  const ids = [...document.querySelectorAll('input:checked')]
    .map(i => Number(i.value));

  const res = await fetch('/api/ship', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ orderIds: ids }),
  });

  const data = await res.json();

  alert(
    'PDF 已產生：' +
      data.pdf +
      '\n\n公告文如下：\n\n' +
      data.announcement
  );
}

load();
</script>
</body>
</html>
