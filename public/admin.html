<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>訂單管理</title>
</head>
<body>

<h2>訂單管理</h2>

<select id="filter" onchange="load()">
  <option value="all">全部</option>
  <option value="notArrived">未到貨</option>
  <option value="arrived">已到貨</option>
  <option value="shipped">已出貨</option>
</select>

<table border="1" id="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>商品</th>
      <th>顏色</th>
      <th>尺寸</th>
      <th>數量</th>
      <th>狀態</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function load() {
  const f = document.getElementById('filter').value;
  const res = await fetch(`/api/admin/orders?filter=${f}`);
  const data = await res.json();

  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML = '';

  data.forEach(o => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${o.orderId}</td>
      <td>${o.productName}</td>
      <td>${o.colorName}</td>
      <td>${o.size}</td>
      <td>${o.qty}</td>
      <td>${o.shipStatus || o.arriveStatus || '未處理'}</td>
      <td>
        <button onclick="arrived(${o.orderId})">到貨</button>
        <button onclick="shipped(${o.orderId})">出貨</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function arrived(id) {
  await fetch('/api/admin/arrived', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ orderId: id })
  });
  load();
}

async function shipped(id) {
  await fetch('/api/admin/shipped', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ orderId: id })
  });
  load();
}

load();
</script>

</body>
</html>
